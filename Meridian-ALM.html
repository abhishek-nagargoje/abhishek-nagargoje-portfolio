function render() {
  const app = $('#app');
  const a = document.activeElement;
  const keep = a && a.id && app.contains(a) ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  if (!state.session) {
    app.innerHTML = viewLogin();
    document.title = 'Sign in – SAP Cloud ALM';
  } else {
    let html;
    try { html = (VIEWS[state.route.path] || viewNotFound)(); } catch (err) {
      console.error(err);
      html = page({ title: 'This screen could not be displayed', body: `<div class="msg bad">${icon('alert')}<div>An unexpected error occurred while displaying this screen. No data was changed.</div></div><a class="btn" href="#/">Go to the launchpad</a>` });
    }
    app.innerHTML = `${viewShell()}<div class="body">${viewNav()}<main id="main" tabindex="-1">${html}</main></div>`;
    document.title = `${navLabel(state.route.path) || 'Page not found'} – SAP Cloud ALM`;
  }
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch { /* not a text input */ } }
  }
  state.route.fresh = false;
}
function touchSession() {
  if (!state.session) return true;
  if (state.session.expires < Date.now()) { expireSession(); return false; }
  if (Date.now() + SESSION_HOURS * 3600000 - state.session.expires > 60000) { state.session.expires = Date.now() + SESSION_HOURS * 3600000; saveSession(); }
  return true;
}
function expireSession() {
  state.session = null;
  storage.remove(SESSION_KEY);
  state.ui.loginNote = 'Your session expired. Sign in again.';
  closeDialog();
  render();
}
let loggingIn = false;
function doLogin(form) {
  if (loggingIn) return;
  const errBox = $('#login-err'), email = form.email.value, pw = form.password.value;
  const fail = (msg, el) => { errBox.innerHTML = `<div class="msg bad" role="alert">${icon('alert')}<div>${esc(msg)}</div></div>`; if (el) { el.setAttribute('aria-invalid', 'true'); el.focus(); } };
  form.email.removeAttribute('aria-invalid'); form.password.removeAttribute('aria-invalid'); errBox.innerHTML = '';
  if (!email.trim()) return fail('Enter your email address.', form.email);
  if (!pw) return fail('Enter your password.', form.password);
  loggingIn = true;
  const b = $('#login-submit');
  b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span> Signing in…';
  setTimeout(() => {
    try {
      authenticate(email, pw);
      state.ui.loginNote = null;
      state.ui.popover = null;
      render();
      $('#main')?.focus({ preventScroll: true });
      toast(`Signed in as ${realUser().name}`);
    } catch (err) {
      b.disabled = false; b.textContent = 'Sign in';
      form.password.value = '';
      fail(err instanceof SimError ? err.message : 'Sign-in failed unexpectedly. Please try again.', form.password);
    } finally { loggingIn = false; }
  }, 30);
}
function submitDialog(form) {
  if (!dialog || dialog.busy || state.ui.usedTokens.has(dialog.token)) return;
  if (!touchSession()) return;
  dialog.busy = true;
  const sb = $('#dlg-submit');
  if (sb) sb.disabled = true;
  const fd = new FormData(form), v = Object.fromEntries(fd);
  const snapshot = JSON.stringify(state.db);
  try {
    const r = dialog.onSubmit(v, fd) || {};
    state.ui.usedTokens.add(dialog.token);
    closeDialog();
    saveData();
    if (r.go && r.go !== location.hash) location.hash = r.go; else render();
    if (r.msg) toast(r.msg);
  } catch (err) {
    state.db = JSON.parse(snapshot);
    dialog.busy = false;
    if (sb) sb.disabled = false;
    if (err instanceof SimError) dialogError(err);
    else { console.error(err); dialogError(new SimError('An unexpected error occurred. Nothing was saved.')); }
  }
}

document.addEventListener('click', (e) => {
  if (state.ui.popover && !e.target.closest('.pop, [data-pop], #search-box, [data-action="open-search"]')) closePopover();
  const el = e.target.closest('[data-action]');
  if (el && !el.disabled && ACTIONS[el.dataset.action]) {
    if (el.dataset.action !== 'toggle-password' && !touchSession()) return;
    if (el.tagName === 'A') e.preventDefault();
    ACTIONS[el.dataset.action](el, e);
    return;
  }
  const row = e.target.closest('tr.link[data-href]');
  if (row && !e.target.closest('a, button, input, select, textarea, label')) go(row.dataset.href);
});
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.id === 'login-form') { e.preventDefault(); doLogin(f); return; }
  if (f.id === 'dlg') { e.preventDefault(); submitDialog(f); return; }
  const kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  if (!touchSession()) return;
  if (kind === 'comment' || kind === 'inc-note') {
    const ta = f.querySelector('textarea');
    if (!ta.value.trim()) { ta.setAttribute('aria-invalid', 'true'); ta.focus(); toast('Enter some text first.'); return; }
    runAction(() => (kind === 'comment' ? addComment(f.dataset.entity, f.dataset.id, ta.value) : addIncidentNote(f.dataset.id, ta.value)), kind === 'comment' ? 'Comment posted' : 'Note added');
  } else if (kind === 'settings') {
    const v = Object.fromEntries(new FormData(f));
    runAction(() => updateSettings(v), 'Settings saved');
  }
});

      body: `<p>Replace all data in this browser with the contents of <b>${esc(file.name)}</b>? Export first if you want to keep the current data.</p>`,
      onSubmit: () => { importData(String(reader.result)); state.ui.lists = {}; return { msg: 'Data imported', go: '#/' }; } });
    reader.onerror = () => infoDialog('Import not possible', 'The file could not be read.');
    reader.readAsText(file);
    return;
  }
  if (t.matches('select[data-filter]')) { setFilter(t); return; }
  if (!t.dataset.change || !touchSession()) return;
  if (t.dataset.change === 'task-status') runAction(() => setTaskStatus(t.dataset.id, t.value), (x) => `${x.id} is now ${x.status}`);
  if (t.dataset.change === 'project-status') runAction(() => setProjectStatus(t.dataset.id, t.value), (p) => `Project status set to ${p.status}`);
  if (t.dataset.change === 'defect-assign') runAction(() => assignDefect(t.dataset.id, t.value), (d) => `${d.id} assigned to ${userName(d.assigneeId)}`);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (dialog) { if (!dialog.busy) closeDialog(); e.preventDefault(); return; }
    if (state.ui.popover) { const p = state.ui.popover; closePopover(); (p === 'search' ? $('#gsearch') : $(`[data-pop="${p}"]`))?.focus(); return; }
    if (state.ui.navOpen && window.innerWidth <= 600) { state.ui.navOpen = false; render(); }
    return;
  }
  if (e.key === 'Tab' && dialog) {
    const f = $$('#dlg button:not([disabled]), #dlg input:not([type=hidden]):not([disabled]), #dlg select, #dlg textarea, #dlg a[href]');
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!$('#dlg').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.target.id === 'gsearch') {
    const links = $$('#search-results a');
    const i = links.findIndex((a) => a.classList.contains('on'));
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!links.length) return;
      const n = e.key === 'ArrowDown' ? Math.min(links.length - 1, i + 1) : Math.max(0, i - 1);
      links.forEach((a, k) => a.classList.toggle('on', k === n));
      links[n].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const target = links[Math.max(0, i)];
      if (target) { const h = target.getAttribute('href'); closePopover(); e.target.value = ''; go(h); }
    }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.link[data-href]')) { e.preventDefault(); go(e.target.dataset.href); }
});
window.addEventListener('hashchange', () => {
  const prev = state.route.parts.join('/');
  parseHash();
  if (dialog) closeDialog();
  state.ui.popover = null; state.ui.searchQ = '';
  if (window.innerWidth <= 600) state.ui.navOpen = false;
  if (!touchSession()) return;
  render();
  if (prev !== state.route.parts.join('/')) { window.scrollTo(0, 0); if (state.session) $('#main')?.focus({ preventScroll: true }); }
});
/* Another tab of the same browser changed the data or the session: adopt it instead of overwriting it.
   (This only applies within one browser profile – nothing is synchronised between browsers or users.) */
window.addEventListener('storage', (e) => {
  if (e.key === STORE_KEY && e.newValue) {
    try { const d = JSON.parse(e.newValue); if (isValidData(d)) { state.db = d; if (state.session && !userById(state.session.actingAs)) state.session.actingAs = null; if (!dialog) render(); } } catch { /* ignore unreadable data */ }
  } else if (e.key === SESSION_KEY) {
    let s = null;
    try { s = JSON.parse(e.newValue); } catch { s = null; }
    state.session = s && s.expires > Date.now() && userById(s.userId) ? s : null;
    if (!state.session) closeDialog();
    render();
  }
});

/* ═════════════════════ 13. INITIALIZATION ═════════════════════ */
function init() {
  state.ui.usedTokens = new Set();
  const status = loadData();
  const s = restoreSession();
  if (s === 'expired') state.ui.loginNote = 'Your session expired. Sign in again.';
  if (status === 'recovered') state.ui.flash = { kind: 'warn', text: 'Stored data could not be read, so the initial data set was loaded. A backup of the unreadable data was kept in this browser.' };
  state.ui.navOpen = window.innerWidth > 600 && storage.get(NAV_KEY) === '1';
  parseHash();
  render();
  setInterval(() => { if (state.session && state.session.expires < Date.now()) expireSession(); }, 60000);
}
/* Read-only handle for automated browser tests: returns copies, never live objects, and holds no credentials. */
Object.defineProperty(window, 'MeridianALM', { value: Object.freeze({
  schema: SCHEMA_VERSION,
  snapshot: () => JSON.parse(JSON.stringify(state.db)),
  route: () => ({ ...state.route }),
  actingAs: () => state.session?.actingAs || null,
}) });
init();
})();
</script>
