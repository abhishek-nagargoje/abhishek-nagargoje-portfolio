<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAP Finance – Trial Balance</title>
<meta name="description" content="SAP Finance: planning and analysis, parallel-ledger accounting and close, fixed assets, payables and receivables, GST and treasury .">
<meta name="robots" content="noindex">
<style>
:root{--blue:#0a6ed1;--blue-d:#0854a0;--hd:#1d2d3e;--ink:#1d2d3e;--mut:#556b82;--line:#d9d9d9;--line2:#e5e5e5;--bg:#f5f6f7;--shell:#1d2d3e;--ok:#188918;--err:#bb0000;--warn:#c35500;--sh:0 2px 8px rgba(0,0,0,.16);color-scheme:light;font-family:"72","72full",Arial,Helvetica,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:#fff;color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mark{background:var(--blue);color:#fff;font-weight:800;font-size:11px;width:32px;height:32px;border-radius:6px;display:grid;place-items:center;letter-spacing:.3px;flex:none}
/* ---------- login ---------- */
.lg-wrap{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:#fff}
.lg-side{background:linear-gradient(160deg,#002a86 0%,#0a6ed1 62%,#4db1ff 100%);color:#fff;padding:48px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-side .brand{display:flex;align-items:center;gap:12px;font-size:16px;line-height:1.2}.lg-side .brand b{display:block}
.lg-side .brand .mark{background:#fff;color:var(--blue)}
.lg-side h2{font-size:30px;line-height:1.25;margin:auto 0 14px;max-width:440px;font-weight:700;position:relative;z-index:1}
.lg-side p{margin:0;max-width:420px;opacity:.9;font-size:15px;line-height:1.55;position:relative;z-index:1}
.lg-side ul{list-style:none;padding:0;margin:22px 0 auto;display:grid;gap:9px;font-size:14px;position:relative;z-index:1}
.lg-side li{display:flex;gap:10px;align-items:center}.lg-side li::before{content:"";width:6px;height:6px;border-radius:50%;background:#bfe0ff;flex:none}
.lg-side svg.deco{position:absolute;right:-30px;bottom:-10px;width:380px;opacity:.16}
.lg-main{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.lg-form{width:100%;max-width:380px}
.lg-form .eyebrow{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:#ebf5fe;border:1px solid #c9e2fa;border-radius:4px;padding:3px 8px;margin-bottom:18px}
.lg-form h1{font-size:28px;line-height:1.2;margin:0 0 6px;color:var(--hd)}
.lg-form .sub{margin:0 0 24px;color:var(--mut);font-size:15px}
.lg-form label{display:block;font-size:14px;color:var(--mut);margin:16px 0 6px}
.lg-form label .req{color:var(--err)}
.fld{width:100%;height:40px;border:1px solid #89919a;border-radius:6px;padding:0 12px;background:#fff;font-size:15px}
.fld:hover{border-color:var(--blue)}.fld:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(10,110,209,.2)}
.fld[aria-invalid=true]{border-color:var(--err);box-shadow:inset 0 -1px 0 var(--err);background:#fff8f8}
.fld:read-only{background:#f5f6f7}
.pwf{position:relative}.pwf .fld{padding-right:46px}
.pwf button{position:absolute;right:4px;top:4px;width:36px;height:32px;border:0;background:none;color:var(--blue);border-radius:4px;display:grid;place-items:center}.pwf button:hover{background:#ebf5fe}
.strip{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:6px;padding:10px 12px;font-size:14px;margin:0 0 4px}
.strip.e{background:#ffebeb;border-color:#ff8888;color:#aa0808}
.lg-btn{width:100%;height:44px;margin-top:24px;border-radius:8px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.lg-btn:hover:not(:disabled){background:var(--blue-d)}.lg-btn:disabled{opacity:.75;cursor:progress}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.lg-note{font-size:12px;color:var(--mut);margin:20px 0 0;line-height:1.5}
.lg-mob{display:none}
@media(max-width:860px){.lg-wrap{grid-template-columns:1fr}.lg-side{display:none}.lg-mob{display:flex;align-items:center;gap:10px;margin-bottom:28px;font-size:15px;line-height:1.2}.lg-mob b{display:block}.lg-main{align-items:flex-start;padding:28px 20px}.lg-form h1{font-size:24px}}
/* ---------- product page (follows the reference screenshots) ---------- */
.pub-h{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2);min-height:58px;display:flex;align-items:center;padding:8px 22px;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pub-h .t{font-size:17px;line-height:1.3;color:var(--hd);font-weight:600}.pub-h .t span{display:block;font-size:15px;font-weight:400;color:var(--hd)}
.ddb{border:0;background:none;color:var(--hd);padding:6px;margin-right:-6px;border-radius:6px}.ddb svg.i{width:26px;height:26px;stroke-width:2}.ddb:hover{background:#ebf5fe}
.menu{position:absolute;right:12px;top:56px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.2);border-radius:8px;min-width:250px;padding:6px 0;z-index:60}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;color:var(--ink)}
.menu button:hover{background:#ebf5fe}.menu hr{border:0;border-top:1px solid var(--line2);margin:6px 0}.menu small{display:block;padding:6px 16px;color:var(--mut)}
.pub-w{max-width:1040px;margin:0 auto;padding:0 22px}
.hero{height:168px;margin:20px 0 0;border-radius:8px;background:linear-gradient(120deg,#002a86 0%,#0a6ed1 60%,#4db1ff 100%);position:relative;overflow:hidden}
.hero svg{position:absolute;right:-10px;bottom:0;height:100%;opacity:.9}
.pub-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--blue);background:#ebf5fe;border:1px solid #c9e2fa;border-radius:4px;padding:2px 8px;margin:24px 0 0}
.pub-w h1{font-size:22px;line-height:1.25;margin:28px 0 16px;color:var(--hd);font-weight:700;max-width:640px}
.intro{margin:0 0 30px;font-size:16px;line-height:1.55;max-width:680px;color:var(--hd)}
.acc{border-top:1px solid var(--line)}.acc:first-child{border-top:0}.accs{border-bottom:1px solid var(--line)}
.acc>button{display:flex;gap:20px;align-items:center;width:100%;text-align:left;background:none;border:0;min-height:61px;padding:10px 4px 10px 16px;font-size:16px;letter-spacing:-.1px;line-height:1.3;font-weight:600;color:var(--hd)}
.acc>button svg{color:var(--blue);transition:transform .15s;width:16px;height:16px;stroke-width:2.4}
.acc>button[aria-expanded=true] svg{transform:rotate(90deg)}
.acc .pn{padding:4px 0 26px;font-size:16px;line-height:1.55}
.shot{border:1px solid var(--line2);background:#f5f8fc;margin:0 0 18px;overflow:hidden;max-width:620px}
.shot svg{display:block;width:100%;height:auto}
.tn{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px;max-width:620px}
.tn span{min-width:110px;text-align:center;font-size:16px}
.circ{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:#fff;color:var(--blue);display:grid;place-items:center}
.circ:hover:not(:disabled),.circ:focus,.circ:active{border-color:#89919a;background:#f5f6f7;outline:none}.circ:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.circ:disabled{opacity:.35;cursor:default}
.trylink{display:block;margin:14px auto 0;max-width:620px;text-align:center}
.link{color:var(--blue);font-weight:700;background:none;border:0;padding:8px 0;font-size:15px}.link:hover{text-decoration:underline}
.cta{padding:40px 0 100px;text-align:center}
.cta h2{font-size:17px;line-height:1.35;margin:0 auto 18px;color:var(--hd);max-width:360px;font-weight:600}
.cta .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cta .note{max-width:560px;margin:16px auto 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:8px;background:var(--blue);color:#fff;border:0;box-shadow:var(--sh);display:grid;place-items:center;z-index:70}
.fab svg.i{width:28px;height:28px}
.panel{position:fixed;right:16px;bottom:82px;width:min(340px,calc(100vw - 32px));background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:71;overflow:hidden}
.panel h3{margin:0;background:var(--blue);color:#fff;padding:12px 16px;font-size:15px}.panel>div{padding:14px 16px;font-size:14px}
.panel .btn{margin:10px 8px 0 0}
/* ---------- buttons ---------- */
.btn{height:36px;border-radius:8px;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:0 14px;font-weight:700;white-space:nowrap;font-size:14px}
.btn:hover:not(:disabled){background:#ebf5fe}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover:not(:disabled){background:var(--blue-d)}.btn.g{border-color:#bcc3ca;color:var(--ink)}.btn.sm{height:28px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.lg{height:44px;padding:0 24px;font-size:15px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.d{border-color:var(--err);color:var(--err)}
/* ---------- Fiori-style shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.sb{height:48px;background:var(--shell);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none}
.sb .mark{width:28px;height:28px;font-size:10px}.sb .ttl{font-weight:700;white-space:nowrap}
.sb select{background:#2c4056;color:#fff;border:0;border-radius:6px;height:30px;padding:0 6px;max-width:200px}
.sb .ib{background:none;border:0;color:#fff;border-radius:6px;padding:6px;position:relative;display:grid;place-items:center}.sb .ib:hover{background:rgba(255,255,255,.12)}
.sb .so{background:none;border:1px solid #8da2b8;color:#fff;border-radius:6px;height:30px;padding:0 10px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}.sb .so:hover{background:rgba(255,255,255,.12)}
.sb .acct{font-size:12px;opacity:.85;white-space:nowrap}
.bdg{position:absolute;top:0;right:-2px;background:var(--err);font-size:10px;border-radius:8px;padding:0 5px;line-height:15px}
.body{display:flex;flex:1;min-height:0}
.nav{width:248px;background:#fff;border-right:1px solid var(--line2);overflow:auto;padding:8px;flex:none}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 12px;border-radius:8px;text-align:left;color:var(--ink)}
.nav button:hover{background:#ebf5fe}.nav button[aria-current=page]{background:#e5f0fa;color:var(--blue);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
.nav h6{margin:14px 12px 4px;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em}
.main{flex:1;overflow:auto;padding:16px 24px 64px;min-width:0}
.bc{font-size:12px;color:var(--mut);margin-bottom:2px}.main h1{font-size:22px;margin:0 0 14px;color:var(--hd)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.inp{height:34px;border:1px solid #89919a;border-radius:6px;padding:0 10px;background:#fff;min-width:0}.inp:hover{border-color:var(--blue)}.inp:focus{border-color:var(--blue)}
.inp:disabled{background:#f5f6f7;border-color:#bcc3ca}
textarea.inp{height:auto;padding:8px 10px}
.w{width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:14px}.tile small{color:var(--mut)}.tile b{display:block;font-size:21px;margin-top:6px}
.tile .sub{font-size:12px;color:var(--mut);margin-top:4px}
.tile.link2{cursor:pointer}.tile.link2:hover{box-shadow:0 0 0 2px var(--blue)}
.sec{background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);margin-bottom:16px;overflow:hidden}
.sec h2{font-size:15px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:400}
.pad{padding:14px 16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#f5f6f7;text-align:left;font-weight:700;color:var(--mut);white-space:nowrap}th,td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;background:#fafafa}.empty{padding:28px;text-align:center;color:var(--mut)}
td .btn{margin:2px 2px 2px 0}
.st{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap;color:#556b82;background:#f5f6f7;border-color:#bcc3ca}
.st.Submitted,.st.Pending,.st.Warning,.st.In-progress,.st.Partially-paid,.st.Unmatched,.st.Open-differences{color:#a04600;background:#fff3e0;border-color:#f0b27a}
.st.Posted,.st.Open,.st.Paid,.st.Pass,.st.Approved,.st.Completed,.st.Matched,.st.Closed,.st.Active,.st.Reconciled,.st.Settled{color:var(--ok);background:#e9f7e9;border-color:#9ccf9c}
.st.Rejected,.st.Reversed,.st.Fail,.st.Overdue,.st.Cancelled{color:var(--err);background:#ffebeb;border-color:#f0a0a0}
.pos{color:var(--ok)}.neg{color:var(--err)}
dialog{border:0;border-radius:12px;padding:0;max-width:660px;width:calc(100vw - 24px);max-height:calc(100vh - 24px);box-shadow:0 10px 40px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form,dialog .dlgb{padding:20px}dialog h2{margin:0 0 12px;font-size:18px}.fl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.ln{display:grid;grid-template-columns:2fr 1fr 1fr 32px;gap:6px;margin-bottom:6px}.ln .inp{width:100%}.ln .x{border:0;background:none;color:var(--err);font-size:18px}
.err{color:var(--err);font-size:13px;margin-top:8px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
fieldset{border:1px solid var(--line2);border-radius:8px;margin:12px 0 0;padding:4px 12px 12px}legend{font-size:12px;font-weight:700;color:var(--mut);padding:0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:12px;overflow:auto}.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap}.tabs button[aria-selected=true]{border-color:var(--blue);color:var(--blue);font-weight:700}
.toasts{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:#fff;border-left:4px solid var(--ok);box-shadow:var(--sh);padding:10px 16px;border-radius:6px}.toast.e{border-color:var(--err)}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:14px 16px}
.area{border:1px solid var(--line2);border-radius:10px;padding:12px}.area h3{margin:0 0 6px;font-size:14px}.area p{margin:0 0 8px;color:var(--mut);font-size:13px}.area .btn{margin:2px 4px 2px 0}
.tree ul{list-style:none;margin:0;padding-left:26px;border-left:1px dashed #9fb0c2}
.tree>ul{border:0;padding-left:0}.tree li{position:relative;padding-top:6px}
.tree li li::before{content:"";position:absolute;left:-26px;top:26px;width:22px;border-top:1px dashed #9fb0c2}
.node{display:inline-block;background:#fff;border:1px solid #c9d3dd;border-left:4px solid var(--blue);border-radius:8px;padding:6px 10px;min-width:200px}
.node b{display:block;font-size:15px}.node small{color:var(--mut)}.node.in{border-left-color:#e26b0a}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px}
.cal .d{min-height:78px;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:4px;font-size:12px;overflow:hidden}
.cal .d.x{background:transparent;border-color:transparent}.cal .d.t{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.chip{display:block;border-radius:4px;padding:1px 5px;margin-top:3px;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;width:100%;text-align:left}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:0 16px 12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}.chk:last-child{border-bottom:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.chk .ic.ok{background:#e9f7e9;color:var(--ok)}.chk .ic.no{background:#fff3e0;color:var(--warn)}
.chk .tx{flex:1;min-width:200px}.chk .tx small{display:block;color:var(--mut)}
.hm{display:none}
@media(max-width:900px){.nav{position:fixed;top:48px;bottom:0;left:0;z-index:40;box-shadow:var(--sh);transform:translateX(-102%);transition:transform .2s}.nav.open{transform:none}.main{padding:12px 12px 64px}.hm{display:grid!important}.sb .acct,.sb .co,.sb .who{display:none}.sb select{max-width:150px}.sb{gap:6px;padding:0 8px}.sb .so span{display:none}.sb .so{padding:0 6px}}
@media(max-width:600px){.tools input[type=search]{max-width:none;flex-basis:100%}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:10px 12px}.tile b{font-size:17px}}@media(max-width:420px){.sb .ttl{display:none}.pub-w{padding:0 20px}.pub-h{padding:8px 20px}}
/* ===== Fiori (Quartz Light) restyle – shell, controls, tables ===== */
:root{--blue:#0a6ed1;--blue-d:#0854a0;--hd:#32363a;--ink:#32363a;--mut:#6a6d70;--line:#d9d9d9;--line2:#e5e5e5;--bg:#f7f7f7;--shell:#354a5f;--sh:0 0 2px rgba(0,0,0,.15),0 2px 4px rgba(0,0,0,.1)}
body{font-family:"72","72full",Arial,Helvetica,sans-serif}
.sb{height:47px;background:#354a5f;border-bottom:3px solid #2aa3ea;gap:6px;padding:0 10px}
.sb .ttl{font-size:14px;font-weight:700;margin-left:6px}.sb .co{margin-right:8px}
svg.saplogo{width:54px;height:26px;flex:none;display:block}
.sb .ib{width:36px;height:36px;border-radius:4px}.sb .ib:hover{background:#283848}
.av{width:32px;height:32px;border-radius:50%;background:#1b4f86;color:#fff;border:1px solid rgba(255,255,255,.6);font-weight:700;font-size:13px;margin-left:4px}
.umw{position:relative}
.umenu{position:absolute;right:0;top:42px;background:#fff;color:var(--ink);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.28);min-width:270px;padding:6px 0;z-index:90}
.umenu .uh{padding:8px 16px 10px;border-bottom:1px solid var(--line2)}.umenu .uh small{display:block;color:var(--mut);font-size:12px}
.umenu label{display:block;font-size:12px;color:var(--mut);padding:10px 16px 4px}
.umenu select{display:block;margin:0 16px 8px;width:calc(100% - 32px);height:32px;border:1px solid #89919a;border-radius:4px;background:#fff;color:var(--ink);max-width:none;padding:0 6px}
.umenu .so{border:0;border-top:1px solid var(--line2);border-radius:0;color:var(--ink);width:100%;justify-content:flex-start;padding:10px 16px;height:auto;font-size:14px}.umenu .so:hover{background:#f5f5f5}
.umenu.srch{width:320px;padding:8px}.umenu.srch input{width:100%;height:32px;border:1px solid #89919a;border-radius:4px;padding:0 8px;margin-bottom:4px}

function grir(p){const d=p.grVal-p.irVal-p.adj;
  if(!p.gr&&!p.ir)return {s:'Awaiting delivery',hint:'No goods receipt or invoice yet.',d};
  if(p.ir>p.gr)return {s:'Invoiced, not received',hint:`Supplier billed ${p.ir-p.gr} unit(s) not yet received – follow up with ${p.vendor} or block payment.`,d,bad:true};
  if(p.gr>p.ir)return {s:'Received, not invoiced',hint:`${p.gr-p.ir} unit(s) received and accrued in GR/IR; waiting for the supplier invoice. No action needed.`,d};
  if(d!==0)return {s:'Price difference',hint:`Quantities match but the invoice is ₹${fmt(Math.abs(d))} ${d<0?'above':'below'} the PO price. Proposed: clear to 510000 Operating Expenses.`,d,bad:true,clear:true};
  return {s:p.gr===p.qty?'Matched':'Matched (partial)',hint:'GR and IR agree.',d};
}

    audit(`Signed in (${acc.email}) as ${S.user.name}`,'session',S.user.name);draw();window.scrollTo(0,0);
  }catch(e){

const stat=s=>`<span class="st ${String(s).replace(/[^A-Za-z]+/g,'-').replace(/-$/,'')}">${esc(s)}</span>`;
function tbl(h,rows,num,foot){num=num||[];return `<div class="tw"><table><thead><tr>${h.map((x,i)=>`<th scope="col" class="${num.includes(i)?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr${r.cls?` class="${r.cls}"`:''}>${r.map((c,i)=>`<td class="${num.includes(i)?'n':''}">${c??''}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="empty">No records.</td></tr>`}${foot||''}</tbody></table></div>`}
const totRow=r=>{r.cls='tot';return r};
function tabs(view,list){const cur=S.tabs[view]||list[0][0];return [cur,`<div class="tabs" role="tablist">${list.map(([k,l])=>`<button role="tab" data-a="tab" data-v="${view}" data-k="${k}" aria-selected="${cur===k}">${l}</button>`).join('')}</div>`]}
const sel=(key,opts,label)=>`<label class="fl" style="margin:0" for="s-${key}">${label}</label><select class="inp" id="s-${key}" data-set="${key}">${opts.map(([v,l])=>`<option value="${v}" ${String(S[key])===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const search=(key,ph)=>`<input class="inp" id="q-${key}" data-q="${key}" type="search" placeholder="${ph}" aria-label="${ph}" value="${esc(S[key])}" style="flex:1;min-width:160px;max-width:320px">`;
const perOpts=()=>D.periods.map(p=>[p.id,`${mName(p.id)} ${p.open?'(open)':'(closed)'}`]);
const cv=c=>S.cur==='USD'?Math.round(c/D.fx.USD):c;
const curL=()=>S.cur==='USD'?'USD (group)':'INR (company)';
function navCurrent(v,t){if(S.view!==v)return false;const tabbed=NAV.filter(n=>n[0]===v&&n[1]).map(n=>n[1]),ct=S.tabs[v];return t?ct===t:!tabbed.includes(ct)}
const jlink=id=>`<button class="link" style="font-size:13.5px;padding:0" data-a="viewj" data-id="${id}">${id}</button>`;

const sideHidden=()=>S.view==='trial'?S.navHideTrial!==false:!!S.navHide;
function shell(){
  const nb=pendingCount(),allowed=USERS.filter(u=>SESSION.personas.includes(u.id)),ini=S.user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const title=S.view==='home'?'Finance Overview':PAGES[S.view],gq=(S.gsq||'').toLowerCase(),apps=Object.entries(PAGES).filter(([k,l])=>!gq||l.toLowerCase().includes(gq));
  return `<div class="shell"><header class="sb"><button class="ib" data-a="tbside" aria-label="Toggle navigation" aria-expanded="${!sideHidden()}">${ic('menu')}</button><button class="ib" data-a="tbback" aria-label="Back to overview" title="Back">${ic('back')}</button>${SAPLOGO}<span class="ttl">${esc(title)}</span><span style="flex:1"></span><span class="co" style="font-size:12px;opacity:.85;white-space:nowrap">Pune Trading Pvt Ltd · Company 1000 · ${D.keyDate}</span>
<div class="umw"><button class="ib" data-a="tbsrch" aria-label="Search apps" aria-expanded="${!!S.srch}">${ic('search2')}</button>${S.srch?`<div class="umenu srch" role="dialog" aria-label="Search apps"><input data-q="gsq" id="gsq" placeholder="Search apps" aria-label="Search apps" value="${esc(S.gsq||'')}">${apps.map(([k,l])=>`<button data-a="tbgoto" data-v="${k}">${esc(l)}</button>`).join('')||'<p class="note" style="padding:6px">No app found.</p>'}</div>`:''}</div>
<button class="ib" data-a="view" data-v="approvals" aria-label="Approvals: ${nb} waiting" title="Approvals">${ic('bell')}${nb?`<span class="bdg">${nb}</span>`:''}</button>
<div class="umw"><button class="av" data-a="tbum" aria-label="User menu for ${esc(S.user.name)}" aria-expanded="${!!S.um}">${esc(ini)}</button>${S.um?`<div class="umenu" role="menu"><div class="uh"><b>${esc(S.user.name)}</b><small>${esc(S.user.role)}</small><small>${esc(SESSION.email)}</small></div><label for="su">Working as</label><select id="su" aria-label="Working as">${allowed.map(u=>`<option value="${u.id}" ${S.user.id===u.id?'selected':''}>${u.name} · ${u.role}</option>`).join('')}</select><button class="so" data-a="logout">${ic('out')}<span>Sign out</span></button></div>`:''}</div></header>
<div class="body ${sideHidden()?'nh':''}"><nav class="nav ${S.nav?'open':''}" aria-label="Finance navigation">${NAV.map(n=>n[0]==='—'?`<h6>${n[1]}</h6>`:`<button data-a="view" data-v="${n[0]}" data-t="${n[1]}" ${navCurrent(n[0],n[1])?'aria-current="page"':''}>${ic(n[3])}${n[2]}</button>`).join('')}<p class="note" style="padding:12px">Practice data · not affiliated with SAP SE.</p></nav>
<main class="main ${S.view==='trial'?'tb0':''}" id="main">${S.view==='trial'?VIEW.trial():`<div class="bc">${AREA[S.view]} › ${PAGES[S.view]}</div><h1>${PAGES[S.view]}</h1>${VIEW[S.view]()}`}</main></div></div>`}

const VIEW={
home(){const t=totals({ledger:'0L'}),b=t.b,oct=actuals(['2026-10']),bud=planOf('Budget',['2026-10']),ra=roll(oct),rb=roll(bud),gr=-b['210000'],g=gstFor(per(D.keyDate));
  const tile=(l,v,go,tab,sub)=>`<div class="tile link2" data-a="view" data-v="${go}" ${tab?`data-t="${tab}"`:''} tabindex="0" role="button"><small>${l}</small><b>${v}</b>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  const overdue=D.invoices.filter(i=>i.type==='AR'&&isOpenInv(i)&&i.due<D.keyDate);
  const recent=D.journals.filter(live).slice(-6).reverse();
  return `<div class="tiles">${tile('Cash and bank','₹ '+fmt0(cashTotal()),'cash','pos',`${BANKS.length} bank accounts`)}${tile('Receivables','₹ '+fmt0(b['110000']),'ar','',overdue.length?`<span class="neg">${overdue.length} overdue</span>`:'None overdue')}${tile('Payables','₹ '+fmt0(-b['200000']),'ap','',`${D.invoices.filter(i=>i.type==='AP'&&isOpenInv(i)).length} open invoices`)}
  ${tile('Revenue – Oct actual','₹ '+fmt0(ra.rev),'plan','bva',`Budget ₹ ${fmt0(rb.rev)} · ${rb.rev?Math.round(ra.rev/rb.rev*100):0}%`)}${tile('Operating income – Oct','₹ '+fmt0(ra.oi),'plan','bva',`Budget ₹ ${fmt0(rb.oi)}`)}${tile('Net profit – to date (0L)','₹ '+fmt0(t.np),'reports','pl')}
  ${tile('Fixed assets – net book value','₹ '+fmt0(b['120000']+b['125000']),'assets','',`${D.assets.filter(a=>a.status==='Active').length} active assets`)}${tile('GR/IR open balance','₹ '+fmt0(gr),'po','',`${D.pos.filter(p=>grir(p).bad).length} exception(s)`)}${tile('GST '+mName(per(D.keyDate)),g.pay?'₹ '+fmt0(g.pay)+' payable':'₹ '+fmt0(g.cf)+' credit','tax','gst',D.gst[per(D.keyDate)]?'Settled':'Not settled')}${tile('Approvals waiting',pendingCount(),'approvals','','Journals, invoices, planning tasks')}</div>
  <div class="sec"><h2>Explore by area</h2><div class="areas">
   ${[['Financial planning and analysis','Driver-based scenarios, plan versions, planning calendar.',[['plan','bva','Budget vs actuals'],['plan','drv','Value driver tree'],['plan','cal','Planning calendar']]],['Accounting and financial close','Parallel ledgers, fixed assets, journals and the close checklist.',[['trial','','Trial balance'],['journals','','Journals'],['assets','','Fixed assets'],['close','','Close checklist']]],['Finance operations','Supplier and customer invoices, payments and receipts, GR/IR.',[['ap','','Payables'],['ar','','Receivables'],['po','','GR/IR']]],['Compliance and tax management','GST codes, return and settlement, control checks.',[['tax','gst','GST return'],['tax','ctl','Controls'],['audit','','Audit trail']]],['Treasury management','Cash position, liquidity forecast, bank reconciliation.',[['cash','pos','Cash position'],['cash','liq','Liquidity'],['bankrec','','Bank reconciliation']]]].map(([h,p,ls])=>`<div class="area"><h3>${h}</h3><p>${p}</p>${ls.map(([v,t,l])=>`<button class="btn sm" data-a="view" data-v="${v}" data-t="${t}">${l}</button>`).join('')}</div>`).join('')}</div></div>
  <div class="grid2"><div class="sec"><h2>Recent postings</h2>${tbl(['Entry','Date','Description','Amount (₹)'],recent.map(j=>[jlink(j.id),j.date,esc(j.desc),fmt(jTotal(j))]),[3])}</div>
  <div class="sec"><h2>Month-end to-do</h2><div class="pad"><ol style="margin:0;padding-left:20px;line-height:1.9"><li>Review and post journals waiting in <b>Approvals</b>.</li><li>Correct the unbalanced utilities accrual draft and submit it.</li><li>Clear the GR/IR price difference on PO 4500002.</li><li>Reconcile the HDFC and ICICI bank statements.</li><li>Run the supplier payment run and follow up overdue customers.</li><li>Settle GST for September and October.</li><li>Post October depreciation, complete the checklist and close October.</li><li>Update the Q3 forecast in the value driver tree.</li></ol></div></div></div>`},

plan(){const [t,tb]=tabs('plan',[['drv','Value driver tree'],['entry','Plan entry'],['cmp','Version comparison'],['cal','Planning calendar'],['bva','Budget vs actuals']]);return tb+PLAN[t]()},

journals(){const q=S.q.toLowerCase();
  const rows=D.journals.filter(j=>(!q||(j.id+' '+j.desc+' '+j.by+' '+j.src).toLowerCase().includes(q))&&(!S.jst||j.status===S.jst)).slice().reverse();
  return `<div class="tools">${can('create')?`<button class="btn p sm" data-a="newj">+ Create journal</button>`:''}${search('q','Search entry, text, user or source')}${sel('jst',[['','All statuses'],...['Draft','Submitted','Posted','Rejected','Reversed'].map(s=>[s,s])],'Status')}<span class="note" style="margin:0">${rows.length} of ${D.journals.length}</span></div>
  <div class="sec">${tbl(['Entry','Date','Description','Ledger','Curr.','Amount (₹)','Status','Prepared by','Actions'],rows.map(j=>[jlink(j.id),j.date,esc(j.desc)+(j.src!=='Manual'?` <small class="note">· ${esc(j.src)}</small>`:''),j.ledger==='ALL'?'0L + 2L':j.ledger,j.cur,fmt(jTotal(j)),stat(j.status),esc(j.by),jact(j)]),[5])}</div>
  <p class="note">Posted entries can never be edited or deleted – correct them with a reversal, which is linked to the original. Ledger “0L + 2L” postings update both books; ledger-specific entries (for example depreciation) update one.${can('create')?'':' Your role cannot create journals – switch user to Priya Sharma or Anita Desai.'}</p>`},

ledger(){const rows=[];let run=0;
  const js=D.journals.filter(j=>inLedger(j,S.ledger)).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  js.forEach(j=>j.lines.forEach(l=>{if(S.fa&&S.fa!==l.acc)return;run+=l.dr-l.cr;rows.push([j.date,jlink(j.id),accName(l.acc),esc(j.desc),l.dr?fmt(l.dr):'',l.cr?fmt(l.cr):'',S.fa?fmt(run):''])}));
  const ls=js.flatMap(j=>j.lines).filter(l=>!S.fa||l.acc===S.fa);
  return `<div class="tools">${sel('ledger',Object.entries(LEDGERS),'Ledger')}<label class="fl" style="margin:0" for="fa">Account</label><select class="inp" id="fa"><option value="">All accounts</option>${acctOpts(S.fa)}</select><button class="btn sm g" data-a="csv">Export CSV</button></div>
  <div class="sec">${tbl(['Date','Entry','Account','Description','Debit','Credit',S.fa?'Balance':''],rows,[4,5,6],`<tr class="tot"><td></td><td></td><td>Total</td><td></td><td class="n">${fmt(sum(ls,'dr'))}</td><td class="n">${fmt(sum(ls,'cr'))}</td><td></td></tr>`)}</div><p class="note">Only posted entries appear in the ledger. Select one account to see a running balance.</p>`},

assets(){const q=S.fq.toLowerCase(),list=D.assets.filter(a=>!q||(a.id+' '+a.name+' '+a.cls).toLowerCase().includes(q));
  const ml=ar=>ar.m==='SL'?`Straight line ${ar.life}y`:`Declining ${ar.rate}%`;
  const rows=list.map(a=>{const n0=a.cost-postedDep(a,'0L'),n2=a.cost-postedDep(a,'2L'),dep=hasDep(a);
    return [a.id,esc(a.name)+`<br><small class="note">${esc(a.cls)}</small>`,a.acq,fmt(a.cost),fmt(a.salvage),`${ml(a.areas['0L'])}<br><b>${fmt(n0)}</b>`,`${ml(a.areas['2L'])}<br><b>${fmt(n2)}</b>`,stat(a.status),
    `<button class="btn sm" data-a="sched" data-id="${a.id}">Schedule</button>`+(a.status==='Active'&&!dep&&can('create')?`<button class="btn sm" data-a="editasset" data-id="${a.id}">Edit</button><button class="btn sm d" data-a="cancelasset" data-id="${a.id}">Cancel</button>`:'')]});
  const runs=D.depRuns.slice().reverse(),both=depRun(S.depP,'0L')&&depRun(S.depP,'2L');
  const prev=D.assets.filter(a=>a.status==='Active').map(a=>[a.id,esc(a.name),fmt(planned(a,'0L',S.depP)),fmt(planned(a,'2L',S.depP))]);
  return `<div class="tools">${can('create')?`<button class="btn p sm" data-a="newasset">+ Create asset</button>`:''}${search('fq','Search asset, name or class')}<span class="note" style="margin:0">Active cost ₹${fmt(sum(D.assets.filter(a=>a.status==='Active'),'cost'))} · accumulated depreciation (0L) ₹${fmt(-bal()['125000'])}</span></div>
  <div class="sec"><h2>Asset register</h2>${tbl(['Asset','Description','Capitalised','Cost (₹)','Residual (₹)','0L – IFRS · NBV','2L – Local GAAP · NBV','Status','Actions'],rows,[3,4,5,6])}</div>
  <div class="grid2"><div class="sec"><h2>Depreciation run<span class="r">${sel('depP',D.periods.map(p=>[p.id,`${mName(p.id)}${p.open?'':' (closed)'}`]),'Period')}</span></h2>${tbl(['Asset','Name','0L (₹)','2L (₹)'],prev,[2,3],`<tr class="tot"><td></td><td>Total</td><td class="n">${fmt(sum(D.assets.map(a=>planned(a,'0L',S.depP))))}</td><td class="n">${fmt(sum(D.assets.map(a=>planned(a,'2L',S.depP))))}</td></tr>`)}
    <div class="pad"><button class="btn p sm" data-a="rundep" data-p="${S.depP}" ${can('approve')&&!both?'':'disabled'}>Post depreciation for ${mName(S.depP)}</button> ${both?stat('Posted'):''}<p class="note">${can('approve')?'Posts one ledger-specific entry per ledger (Dr 530000 Depreciation / Cr 125000 Accumulated depreciation). Each period can be posted once, in sequence.':'Depreciation runs need a Finance Manager or Finance Controller.'}</p></div></div>
  <div class="sec"><h2>Posted runs</h2>${tbl(['Period','Ledger','Entry','Assets','Amount (₹)','Run by'],runs.map(r=>[r.period,r.ledger,r.je==='—'?'—':jlink(r.je),Object.keys(r.amounts).length,fmt(r.total),esc(r.by)]),[3,4])}</div></div>
  <p class="note">Straight line: (cost − residual) ÷ useful life in months, with the final month absorbing rounding. Declining balance: opening net book value × annual rate ÷ 12, never below the residual value. Depreciation starts in the month of capitalisation. Assets with posted depreciation cannot be edited or cancelled.</p>`},

close(){const p=S.closeP,P=D.periods.find(x=>x.id===p),ch=closeChecks(p),done=ch.filter(c=>c.ok).length;
  return `<div class="tools">${sel('closeP',perOpts(),'Period')}<span>${P?.open?stat('Open'):stat('Closed')}</span><span class="note" style="margin:0">${done} of ${ch.length} checks complete</span></div>
  <div class="sec"><h2>Close checklist – ${mName(p)}<span class="r">${P?.open?`<button class="btn sm p" data-a="closeper" ${done===ch.length&&can('approve')?'':'disabled'}>Close period</button>`:`<button class="btn sm" data-a="tper" data-id="${p}" ${can('approve')?'':'disabled'}>Reopen period</button>`}</span></h2>
  ${ch.map(c=>`<div class="chk"><span class="ic ${c.ok?'ok':'no'}" aria-label="${c.ok?'Complete':'Open'}">${c.ok?'✓':'!'}</span><div class="tx"><b>${c.label}</b><small>${esc(c.detail)}</small></div>${!c.ok&&P?.open?(c.run==='dep'?`<button class="btn sm p" data-a="rundep" data-p="${p}" ${can('approve')?'':'disabled'}>Run depreciation</button>`:c.manual?`<button class="btn sm" data-a="signoff" data-k="${c.k}" ${can('approve')?'':'disabled'}>Sign off</button>`:c.go?`<button class="btn sm g" data-a="view" data-v="${c.go}" data-t="${c.tab||''}">Resolve</button>`:''):c.manual&&c.ok&&P?.open?`<button class="btn sm g" data-a="signoff" data-k="${c.k}" ${can('approve')?'':'disabled'}>Withdraw</button>`:''}</div>`).join('')}</div>
  <div class="sec"><h2>Posting periods</h2>${tbl(['Period','Status','Journals posted','Open documents'],D.periods.map(x=>[mName(x.id),stat(x.open?'Open':'Closed'),D.journals.filter(j=>live(j)&&per(j.date)===x.id).length,D.journals.filter(j=>per(j.date)===x.id&&(j.status==='Draft'||j.status==='Submitted')).length]),[2,3])}</div>
  <p class="note">Closing locks the period: any posting dated in it is rejected until it is reopened. Sign-offs, closing and reopening need a Finance Manager or Finance Controller${can('approve')?'':' – switch user from the top bar'}.</p>`},

reports(){const [t,tb]=tabs('reports',[['tb','Trial balance'],['pl','Profit and loss'],['bs','Balance sheet'],['cmp','Ledger comparison'],['arag','AR ageing'],['apag','AP ageing']]);
  if(t==='arag'||t==='apag'){const ty=t==='arag'?'AR':'AP';return tb+`<div class="sec"><h2>${ty==='AR'?'Accounts receivable':'Accounts payable'} ageing at ${D.keyDate}</h2>${agingTable(ty)}</div><p class="note">Outstanding = gross invoice − receipts or payments allocated. Days overdue are measured from the due date to the key date (Settings). Control account balance: ₹${fmt(ty==='AR'?bal()['110000']:-bal()['200000'])}.</p>`}
  const tools=`<div class="tools">${t!=='cmp'?sel('ledger',Object.entries(LEDGERS),'Ledger'):''}${sel('cur',[['INR','INR – company currency'],['USD','USD – group currency']],'Currency')}${t==='pl'||t==='cmp'?sel('plP',[['','All periods'],...D.periods.map(p=>[p.id,mName(p.id)])],'Period'):''}</div>`;
  const months=S.plP?[S.plP]:null;let body='';
  if(t==='tb'){const b=bal({ledger:S.ledger});let dr=0,cr=0;const rows=ACCTS.filter(a=>b[a.code]).map(a=>{const v=cv(b[a.code]);if(v>0)dr+=v;else cr-=v;return [accName(a.code),v>0?fmt(v):'',v<0?fmt(-v):'']});
    body=tbl(['Account','Debit','Credit'],rows,[1,2],`<tr class="tot"><td>Total</td><td class="n">${fmt(dr)}</td><td class="n">${fmt(cr)}</td></tr>`)+`<div class="pad note">${dr===cr?'Balanced ✔':'Out of balance'} · ${LEDGERS[S.ledger]} · ${curL()}</div>`}
  if(t==='pl'){const tt=totals({ledger:S.ledger,months}),b=tt.b,line=a=>[accName(a.code),fmt(cv(nat(a.code,b[a.code])))];
    body=tbl(['Line','Amount'],[[`<b>Revenue</b>`,''],...ACCTS.filter(a=>a.type==='R').map(line),totRow(['Total revenue',fmt(cv(tt.R))]),['<b>Expenses</b>',''],...ACCTS.filter(a=>a.type==='X').map(line),totRow(['Total expenses',fmt(cv(tt.X))]),totRow(['Net profit',fmt(cv(tt.np))])],[1])+`<div class="pad note">${LEDGERS[S.ledger]} · ${curL()} · ${S.plP?mName(S.plP):'all periods'}</div>`}
  if(t==='bs'){const tt=totals({ledger:S.ledger}),b=tt.b,g=ty=>ACCTS.filter(a=>a.type===ty).map(a=>[accName(a.code),fmt(cv(nat(a.code,b[a.code])))]),eq=tt.E+tt.np;
    body=tbl(['Line','Amount'],[['<b>Assets</b>',''],...g('A'),totRow(['Total assets',fmt(cv(tt.A))]),['<b>Liabilities</b>',''],...g('L'),['<b>Equity</b>',''],...g('E'),['Current-year profit',fmt(cv(tt.np))],totRow(['Total liabilities and equity',fmt(cv(tt.L+eq))])],[1])+`<div class="pad note">${tt.A===tt.L+eq?'Assets = Liabilities + Equity ✔':'Out of balance'}${S.cur==='USD'?' (lines translated individually – small rounding differences possible)':''}</div>`}
  if(t==='cmp'){const a=bal({ledger:'0L',months}),z=bal({ledger:'2L',months});
    body=tbl(['Account','0L – IFRS','2L – Local GAAP','Difference'],ACCTS.filter(x=>a[x.code]||z[x.code]).map(x=>{const v0=cv(nat(x.code,a[x.code])),v2=cv(nat(x.code,z[x.code]));return [accName(x.code),fmt(v0),fmt(v2),v0-v2?`<b>${fmt(v0-v2)}</b>`:'–']}),[1,2,3])+`<div class="pad note">Parallel accounting: one posting can update both ledgers, while valuation differences (here depreciation) are posted only to the ledger they belong to. ${curL()}.</div>`}
  return tb+tools+`<div class="sec">${body}</div><p class="note">Statements are generated from posted journals only. Group currency uses USD 1 = ₹${D.fx.USD}.</p>`},

ap(){return invView('AP')},ar(){return invView('AR')},

po(){const rows=D.pos.slice().reverse().map(p=>{const g=grir(p);return [p.id,esc(p.vendor),esc(p.item),`${p.qty} @ ${fmt(p.price)}`,`${p.gr} / ${fmt(p.grVal)}`,`${p.ir} / ${fmt(p.irVal)}`,g.d?`<b class="${g.d<0?'neg':''}">${fmt(g.d)}</b>`:'0.00',`${stat(g.bad?'Warning':g.s.startsWith('Matched')?'Matched':'Open')} <small>${esc(g.s)}</small>`,
   ((p.gr<p.qty?`<button class="btn sm" data-a="gr" data-id="${p.id}">Post goods receipt</button>`:'')+(g.clear?`<button class="btn sm p" data-a="clrgr" data-id="${p.id}" ${can('approve')?'':'disabled title="Needs Finance Manager or Finance Controller"'}>Clear difference</button>`:''))||'—']});

function forecast(){const start=D.keyDate,wk=[];let open=cashTotal({to:start});

function openPO(){dlg(`<form id="pf"><h2>New purchase order</h2><label class="fl" for="pv">Supplier *</label><input class="inp w" id="pv" maxlength="80"><label class="fl" for="pi">Item *</label><input class="inp w" id="pi" maxlength="80"><div class="g2"><div><label class="fl" for="pq">Quantity *</label><input class="inp w" id="pq" inputmode="numeric"></div><div><label class="fl" for="pp">Unit price (₹, net) *</label><input class="inp w" id="pp" inputmode="decimal"></div></div><div class="err" id="pe" role="alert"></div><div class="ft"><button type="button" class="btn g" data-a="close">Cancel</button><button type="button" class="btn p" data-a="savepo">Create PO</button></div></form>`)}
function openTask(t){const ed=!!t;t=t||{title:'',type:'Planning',due:D.keyDate,assignee:S.user.name,reviewer:S.user.name==='Rahul Mehta'?'Anita Desai':'Rahul Mehta',notes:''};const uo=v=>USERS.map(u=>`<option ${u.name===v?'selected':''}>${u.name}</option>`).join('');

/* ===== actions ===== */
function findJ(id){const j=D.journals.find(x=>x.id===id);if(!j)throw Error(`Entry ${id} was not found.`);return j}
function findI(id){const i=D.invoices.find(x=>x.id===id);if(!i)throw Error(`Invoice ${id} was not found.`);return i}
const refUsed=r=>D.invoices.find(i=>(i.pays||[]).some(p=>p.ref.toLowerCase()===r.toLowerCase()));
function approveInvoice(i){
  if(i.status!=='Pending')throw Error('Only pending invoices can be approved.');
  need('approve','Your role cannot approve invoices.');
  if(i.by===S.user.name&&S.user.role!=='Finance Controller')throw Error('Separation of duties: you cannot approve your own invoice.');
  let p=null;if(i.po){p=D.pos.find(x=>x.id===i.po);if(!p)throw Error(`PO ${i.po} no longer exists.`);if(p.ir+i.qty>p.qty)throw Error(`PO ${p.id} only has ${p.qty-p.ir} unit(s) left to invoice.`)}
  const ls=i.type==='AR'?[L('110000',i.gross,0),L('400000',0,i.net),L('220000',0,i.tax)]:[L(p?'210000':i.exp,i.net,0),L('115000',i.tax,0),L('200000',0,i.gross)];
  const j=autoPost(`Invoice ${i.id} – ${i.party}`,i.date,ls,'Invoice');i.status='Open';i.je=j.id;i.approver=S.user.name;if(p){p.ir+=i.qty;p.irVal+=i.net}audit('Approved invoice',i.id);
}

  case'revj':{need('approve');const j=findJ(id);const r=prompt(`Reverse ${id}? A new entry with opposite debits and credits will be posted. Reason (required):`);if(r===null)return;if(!r.trim())throw Error('A reversal reason is required.');const x=reverseJ(j,r.trim());toast(`${j.id} reversed by ${x.id}${x.date!==j.date?' (posted on key date – original period closed)':''}`);break}
  case'csv':{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['Date','Entry','Ledger','Account','Description','Debit','Credit']];D.journals.filter(j=>inLedger(j,S.ledger)).forEach(j=>j.lines.forEach(l=>{if(!S.fa||S.fa===l.acc)rows.push([j.date,j.id,S.ledger,l.acc,q(j.desc),(l.dr/100).toFixed(2),(l.cr/100).toFixed(2)])}));const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));x.download=`ledger-${S.ledger}.csv`;x.click();toast(`Exported ${rows.length-1} line(s)`);return}

  case'savei':{const t=el.dataset.t,eid=$('#if').dataset.id,party=$('#ip').value.trim(),ref=$('#iref').value.trim(),net=cents($('#ia').value),code=$('#itc').value,date=$('#idt').value,due=$('#idd').value,po=t==='AP'?$('#ipo').value:'',qty=po?parseInt($('#iq').value,10):0;

    if(po){const p=D.pos.find(x=>x.id===po);if(!(qty>0)||qty>p.qty-p.ir)return err(`Quantity must be a whole number between 1 and ${p.qty-p.ir}.`);if(p.vendor.toLowerCase()!==party.toLowerCase())return err(`PO ${p.id} belongs to ${p.vendor}.`)}

  case'settle':{const i=findI(id);if(!isOpenInv(i))throw Error(i.status==='Paid'?'This invoice is already fully settled – duplicate payment blocked.':'Only approved invoices can be settled.');if(i.type==='AP')need('approve','Payments need a Finance Manager or Finance Controller.');openSettle(i);return}
  case'dosettle':{const i=findI($('#sf').dataset.id),amt=cents($('#sa').value),d=$('#sd').value,bank=$('#sb').value,ref=$('#sr').value.trim(),err=m=>{$('#se').textContent=m};
    if(!isOpenInv(i))return err('This invoice is already settled.');if(!(amt>0))return err('Enter an amount greater than zero.');if(amt>outst(i))return err(`The amount exceeds the outstanding balance of ₹${fmt(outst(i))}.`);if(!isDate(d))return err('Enter a valid value date.');if(!ref)return err('Enter the bank reference (UTR) – it prevents duplicate receipts and payments.');

  if(t.closest('#if')){if(t.id==='iq'){const p=D.pos.find(x=>x.id===$('#ipo').value);if(p)$('#ia').value=((parseInt(t.value,10)||0)*p.price/100).toFixed(2)}itot()}});
document.addEventListener('change',e=>{const t=e.target;if(!SESSION)return;
  if(t.id==='fa'){S.fa=t.value;draw()}
  else if(t.id==='su'){const u=USERS.find(x=>x.id===t.value);if(!u||!SESSION.personas.includes(u.id)){toast('This account is not authorised for that user role.',1);draw();return}S.user=u;audit('Switched user to '+u.name,'session');toast('Now working as '+u.name+' ('+u.role+')');draw()}
  else if(t.dataset.set){S[t.dataset.set]=t.value;draw()}
  else if(t.dataset.plan){const[v,a,m]=t.dataset.plan.split('|'),c=cents(t.value);if(c<0){toast('Plan values cannot be negative.',1);draw();return}D.plan[v]=D.plan[v]||{};D.plan[v][a]=D.plan[v][a]||{};D.plan[v][a][m]=c;audit(`Updated plan ${v} ${a} ${m}`,fmt(c));draw()}
  else if(t.dataset.drv){const v=parseFloat(t.value);if(Number.isFinite(v)&&v>=0&&v<=1e9){D.drv[t.dataset.drv]=v;draw();$('#d-'+t.dataset.drv)?.focus()}else{toast('Drivers must be zero or positive numbers.',1);draw()}}
  else if(t.id==='jc'){const r=$('#jr');r.disabled=t.value==='INR';r.value=t.value==='INR'?1:D.fx.USD;jsum()}
  else if(t.id==='ipo'){const p=D.pos.find(x=>x.id===t.value),q=$('#iq');q.disabled=!p;if(p){q.value=p.qty-p.ir;$('#ip').value=p.vendor;$('#ia').value=((p.qty-p.ir)*p.price/100).toFixed(2);$('#iex').disabled=true}else{q.value='';$('#iex').disabled=false}itot()}
  else if(t.id==='itc')itot()});
window.addEventListener('error',e=>{toast('Unexpected error: '+(e.message||'see console'),1)});
let drawing=false;
function draw(){if(drawing)return;drawing=true;try{draw0()}finally{drawing=false}}
function draw0(){
  if(!SESSION){S.page='login';$('#app').innerHTML=loginView();return} // the application is never rendered before authentication
  const sc=$('#main')?.scrollTop;$('#app').innerHTML=S.page==='pub'?pub():shell();const m=$('#main');if(m&&sc)m.scrollTop=sc;save()}
draw();
</script>
