<style>

<body>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<!-- Backend configuration. Empty values (the default) = demo mode. -->
<script src="config.js"></script>
<script>window.ERP_SIM_CONFIG=window.ERP_SIM_CONFIG||{};</script>
<script>
/* =====================================================================
   Finance ERP Training Simulator — independent training application.
   Not an SAP product and not connected to any SAP system.
   Fictional data, saved in this browser (localStorage). Money is held as
   integer paise so ledger arithmetic never accumulates float error.
   ===================================================================== */
const $=s=>document.querySelector(s);

    out['520000'][m]=Math.round(d.headcount*d.salary*100);out['510000'][m]=Math.round(d.opexBase*Math.pow(1+d.opexGrowth/100,i)*100);out['530000'][m]=Math.round(d.dep*100)});return out}
function actuals(months){const b=bal({ledger:'0L',months}),o={};PLACC.forEach(a=>o[a]=nat(a,b[a]));return o}
const planOf=(v,months)=>{const o={};PLACC.forEach(a=>o[a]=sum(months.map(m=>D.plan[v]?.[a]?.[m]||0)));return o};
const roll=o=>{const rev=o['400000']+o['410000'],exp=o['500000']+o['510000']+o['520000']+o['530000'];return {rev,exp,oi:rev-exp}};
const simQ=d=>{const s=simulate(d);return roll(PLACC.reduce((o,a)=>(o[a]=sum(MONTHS.map(m=>s[a][m])),o),{}))};
const DRV=[['units','Units sold – Oct',1],['unitGrowth','Unit growth % / month',0.5],['price','Average price (₹)',1],['cogsPct','COGS % of revenue',0.5],['headcount','Headcount',1],['salary','Avg monthly salary (₹)',500],['opexBase','Opex base – Oct (₹)',1000],['opexGrowth','Opex growth % / month',0.5],['dep','Depreciation / month (₹)',500]];

/* ===== GR/IR ===== */
function grir(p){const d=p.grVal-p.irVal-p.adj;
  if(!p.gr&&!p.ir)return {s:'Awaiting delivery',hint:'No goods receipt or invoice yet.',d};
  if(p.ir>p.gr)return {s:'Invoiced, not received',hint:`Supplier billed ${p.ir-p.gr} unit(s) not yet received – follow up with ${p.vendor} or block payment.`,d,bad:true};
  if(p.gr>p.ir)return {s:'Received, not invoiced',hint:`${p.gr-p.ir} unit(s) received and accrued in GR/IR; waiting for the supplier invoice. No action needed.`,d};
  if(d!==0)return {s:'Price difference',hint:`Quantities match but the invoice is ₹${fmt(Math.abs(d))} ${d<0?'above':'below'} the PO price. Proposed: clear to 510000 Operating Expenses.`,d,bad:true,clear:true};
  return {s:p.gr===p.qty?'Matched':'Matched (partial)',hint:'GR and IR agree.',d};
}

/* ===== tax ===== */
function gstFor(p){ // movement in the period, excluding settlement postings
  const b=bal({months:[p],exclude:['GST settlement']}),out=-b['220000'],inp=b['115000'],bf=D.gst[prevP(p)]?.cf||0;
  const avail=inp+bf,pay=Math.max(0,out-avail),cf=Math.max(0,avail-out);return {out,inp,bf,pay,cf,used:Math.min(out,avail)};
}

/* ===== bank reconciliation ===== */
function bookLines(bank){const out=[];D.journals.forEach(j=>{if(!inLedger(j,'0L'))return;j.lines.forEach((l,i)=>{if(l.acc===bank)out.push({key:j.id+':'+i,j,amt:l.dr-l.cr,date:j.date})})});return out}
const usedKeys=()=>new Set(D.stmt.filter(s=>s.match).map(s=>s.match));
const openBook=g=>{const u=usedKeys();return bookLines(g).filter(b=>b.date>'2026-09-30'&&!u.has(b.key))};
function autoMatch(bank){let n=0;const used=usedKeys();
  D.stmt.filter(s=>!s.match&&s.bank===bank).forEach(s=>{const c=bookLines(s.bank).filter(b=>!used.has(b.key)&&b.date>'2026-09-30'&&b.amt===s.amt&&Math.abs(daysBetween(b.date,s.date))<=7).sort((a,b)=>Math.abs(daysBetween(a.date,s.date))-Math.abs(daysBetween(b.date,s.date)))[0];if(c){s.match=c.key;used.add(c.key);n++}});return n}
function recStatus(g){const lines=D.stmt.filter(s=>s.bank===g),stBal=D.stmtOpen[g]+sum(lines,'amt'),book=bal()[g],ob=openBook(g),um=lines.filter(s=>!s.match);
  return {stBal,book,ob,um,diff:stBal-book,ok:!um.length&&book-sum(ob,'amt')===stBal}}

/* ===== close ===== */
function closeChecks(p){const end=lastDay(p),c=D.close[p]||{};
  const open=D.journals.filter(j=>per(j.date)===p&&(j.status==='Draft'||j.status==='Submitted'));
  const pinv=D.invoices.filter(i=>per(i.date)===p&&i.status==='Pending');
  const um=D.stmt.filter(s=>s.date<=end&&!s.match);
  const gbad=D.pos.filter(x=>grir(x).bad);
  const dep=['0L','2L'].filter(l=>!depRun(p,l)&&D.assets.some(a=>planned(a,l,p)>0));
  const g=gstFor(p),gOk=!!D.gst[p]||(g.out===0&&g.inp===0&&!g.bf);
  const tb=['0L','2L'].every(l=>{const b=bal({ledger:l,to:end});return sum(Object.values(b))===0});
  return [
   {k:'jr',label:'All journals in the period are posted or rejected',ok:!open.length,detail:open.length?`${open.length} open: ${open.map(j=>j.id).join(', ')}`:'No drafts or submitted entries.',go:'journals'},
   {k:'inv',label:'No invoices waiting for approval',ok:!pinv.length,detail:pinv.length?pinv.map(i=>i.id).join(', '):'Nothing waiting for this period.',go:'approvals'},

   {k:'bank',label:`Bank statements reconciled up to ${end}`,ok:!um.length,detail:um.length?`${um.length} unmatched statement line(s).`:'All statement lines matched.',go:'bankrec'},
   {k:'gst',label:'GST for the period settled',ok:gOk,detail:gOk?(D.gst[p]?`Settled in ${D.gst[p].je}.`:'No GST activity.'):`Net payable ₹${fmt(g.pay)}${g.cf?`, credit to carry forward ₹${fmt(g.cf)}`:''}.`,go:'tax',tab:'gst'},
   {k:'tb',label:'Trial balance balances in every ledger',ok:tb,detail:tb?'Debits equal credits in 0L and 2L.':'Out of balance.',go:'reports'},

}

async function doLogin(){
  if(loginBusy)return; // no duplicate submissions
  const emI=$('#em'),pwI=$('#pw'),btn=$('#lb'),email=emI.value.trim().toLowerCase(),pw=pwI.value;
  emI.removeAttribute('aria-invalid');pwI.removeAttribute('aria-invalid');
  const now=Date.now();if(now<lockUntil)return loginMsg(`Too many failed attempts. Try again in ${Math.ceil((lockUntil-now)/1000)} seconds.`);
  if(!email&&!pw){emI.setAttribute('aria-invalid','true');pwI.setAttribute('aria-invalid','true');emI.focus();return loginMsg('Enter your email address and password.')}

  if(!pw){pwI.setAttribute('aria-invalid','true');pwI.focus();return loginMsg('Enter your password.')}

  const started=Date.now(),settle=()=>new Promise(r=>setTimeout(r,Math.max(0,500-(Date.now()-started))));

  <div class="sec"><h2>Simulated plan by month</h2>${tbl(['Account',...MONTHS.map(mName)],[...PLACC.filter(a=>a!=='410000').map(a=>[accName(a),...MONTHS.map(m=>fmt(sim[a][m]))]),totRow(['Operating income',...MONTHS.map(m=>{const o={};PLACC.forEach(a=>o[a]=sim[a][m]);return fmt(roll(o).oi)})])],[1,2,3])}</div>

cmp(){const months=S.cmp==='Q'?MONTHS:[S.cmp],series=[['Actual',roll(actuals(months))],...VERSIONS.map(v=>[v,roll(planOf(v,months))])];

cal(){const m=S.calM,[y,mo]=m.split('-').map(Number),first=new Date(Date.UTC(y,mo-1,1)).getUTCDay(),days=new Date(Date.UTC(y,mo,0)).getUTCDate(),off=(first+6)%7,me=S.user.name;
  const col={Open:'#556b82','In progress':'#e26b0a',Submitted:'#0a6ed1',Completed:'#188918'};

function approveInvoice(i){
  if(i.status!=='Pending')throw Error('Only pending invoices can be approved.');
  need('approve','Your persona cannot approve invoices.');
  if(i.by===S.user.name&&S.user.role!=='Administrator')throw Error('Separation of duties: you cannot approve your own invoice.');
  let p=null;if(i.po){p=D.pos.find(x=>x.id===i.po);if(!p)throw Error(`PO ${i.po} no longer exists.`);if(p.ir+i.qty>p.qty)throw Error(`PO ${p.id} only has ${p.qty-p.ir} unit(s) left to invoice.`)}
  const ls=i.type==='AR'?[L('110000',i.gross,0),L('400000',0,i.net),L('220000',0,i.tax)]:[L(p?'210000':i.exp,i.net,0),L('115000',i.tax,0),L('200000',0,i.gross)];
  const j=autoPost(`Invoice ${i.id} – ${i.party}`,i.date,ls,'Invoice');i.status='Open';i.je=j.id;i.approver=S.user.name;if(p){p.ir+=i.qty;p.irVal+=i.net}audit('Approved invoice',i.id);
}
function act(el){const a=el.dataset.a,id=el.dataset.id;
 if(!SESSION)return; // nothing in the application works before authentication
 try{switch(a){
  /* product page */
  case'acc':{const i=+el.dataset.i;if(el.dataset.only){S.acc={};S.acc[i]=true;S.menu=false;S.chat=false;S.page='pub';draw();$('#p'+i)?.scrollIntoView({behavior:'smooth',block:'center'});return}S.acc[i]=!S.acc[i];break}

  case'delj':{const j=findJ(id);if(j.status!=='Draft'||j.by!==S.user.name)throw Error('Only your own drafts can be deleted.');if(!confirm(`Delete draft ${id}? This cannot be undone.`))return;D.journals=D.journals.filter(x=>x!==j);audit('Deleted draft journal',id);toast(id+' deleted');break}

  case'revj':{need('approve');const j=findJ(id);const r=prompt(`Reverse ${id}? A new entry with opposite debits and credits will be posted. Reason (required):`);if(r===null)return;if(!r.trim())throw Error('A reversal reason is required.');const x=reverseJ(j,r.trim());toast(`${j.id} reversed by ${x.id}${x.date!==j.date?' (posted on key date – original period closed)':''}`);break}
  case'csv':{const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['Date','Entry','Ledger','Account','Description','Debit','Credit']];D.journals.filter(j=>inLedger(j,S.ledger)).forEach(j=>j.lines.forEach(l=>{if(!S.fa||S.fa===l.acc)rows.push([j.date,j.id,S.ledger,l.acc,q(j.desc),(l.dr/100).toFixed(2),(l.cr/100).toFixed(2)])}));const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));x.download=`ledger-${S.ledger}.csv`;x.click();toast(`Exported ${rows.length-1} line(s)`);return}

  case'viewi':{const i=findI(id);dlg(`<div class="dlgb"><h2>${i.type==='AR'?'Receipts':'Payments'} – ${i.id}</h2>${tbl(['Date','Reference','Bank','Entry','Amount (₹)'],i.pays.map(p=>[p.date,esc(p.ref),bankName(p.bank),jlink(p.je),fmt(p.amt)]),[4],`<tr class="tot"><td>Total</td><td></td><td></td><td></td><td class="n">${fmt(i.paid)}</td></tr>`)}<p class="note">Outstanding ₹${fmt(outst(i))}</p><div class="ft"><button class="btn g" data-a="close">Close</button></div></div>`);return}
  case'savei':{const t=el.dataset.t,eid=$('#if').dataset.id,party=$('#ip').value.trim(),ref=$('#iref').value.trim(),net=cents($('#ia').value),code=$('#itc').value,date=$('#idt').value,due=$('#idd').value,po=t==='AP'?$('#ipo').value:'',qty=po?parseInt($('#iq').value,10):0;
    const err=m=>{$('#ie').textContent=m};
    if(!party)return err('Enter the '+(t==='AR'?'customer':'supplier')+' name.');if(t==='AP'&&!ref)return err('Enter the supplier invoice number.');if(!(net>0))return err('Enter a net amount greater than zero.');if(!isDate(date)||!isDate(due))return err('Enter valid invoice and due dates.');if(due<date)return err('The due date cannot be before the invoice date.');

  case'transfer':{need('approve');const f=$('#tf').value,t=$('#tt').value,v=cents($('#ta').value),d=$('#td').value;if(f===t)throw Error('Choose two different accounts.');if(v<=0)throw Error('Enter an amount greater than zero.');if(!isDate(d))throw Error('Enter a valid value date.');
    if(bal({to:d})[f]<v)throw Error(`Insufficient funds in ${bankName(f)} on ${d}.`);const j=autoPost(`Transfer ${bankName(f)} → ${bankName(t)}`,d,[L(t,v,0),L(f,0,v)],'Bank transfer');toast(`Transfer posted (${j.id})`);break}
  case'setfx':{need('admin');const r=parseFloat($('#fxr').value);if(!(r>0))throw Error('Enter a positive rate.');D.fx.USD=r;audit('Changed USD rate',String(r));toast('Rate updated');break}
  default:console.warn('Unhandled action',a);return;
 }}catch(e){toast(e.message||String(e),1)}
 draw()}
function goView(v,t){if(!PAGES[v])return;S.view=v;if(t)S.tabs[v]=t;else if(NAV.some(n=>n[0]===v&&n[1]))delete S.tabs[v];S.nav=false;const m=$('#main');if(m)m.scrollTop=0}

/* ===== events ===== */
document.addEventListener('click',e=>{
  if(e.target.closest('#pwt')){const b=$('#pwt'),p=$('#pw'),show=p.type==='password';p.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'Hide password':'Show password');b.title=show?'Hide password':'Show password';b.innerHTML=ic(show?'eyeoff':'eye');p.focus();return}
  if(S.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-a=menu]')){S.menu=false;draw()}
  const el=e.target.closest('[data-a]');if(el&&!el.disabled){e.preventDefault();act(el)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='lf')doLogin()});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tile[data-a]')){e.preventDefault();act(e.target)}
  if(e.key==='Escape'&&(S.menu||S.chat)){S.menu=S.chat=false;draw()}
  if(S.page==='pub'&&SESSION&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.matches('input,textarea,select')){const pn=e.target.closest('.pn');if(pn){const i=+pn.id.slice(1);if(CATS[i].steps.length)act({dataset:{a:e.key==='ArrowRight'?'next':'prev',i}})}}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.closest('#lf')){loginMsg('');t.removeAttribute('aria-invalid');return}
  if(t.dataset.q){S[t.dataset.q]=t.value;const p=t.selectionStart,idq=t.id;draw();const n=document.getElementById(idq);if(n){n.focus();n.setSelectionRange(p,p)}}
  if(t.closest('#jf'))jsum();
  if(t.closest('#if')){if(t.id==='iq'){const p=D.pos.find(x=>x.id===$('#ipo').value);if(p)$('#ia').value=((parseInt(t.value,10)||0)*p.price/100).toFixed(2)}itot()}});
document.addEventListener('change',e=>{const t=e.target;if(!SESSION)return;
  if(t.id==='fa'){S.fa=t.value;draw()}
  else if(t.id==='su'){const u=USERS.find(x=>x.id===t.value);if(!u||!SESSION.personas.includes(u.id)){toast('This account is not authorised for that persona.',1);draw();return}S.user=u;audit('Switched persona to '+u.name,'session');toast('Now working as '+u.name+' ('+u.role+')');draw()}
  else if(t.dataset.set){S[t.dataset.set]=t.value;draw()}
  else if(t.dataset.plan){const[v,a,m]=t.dataset.plan.split('|'),c=cents(t.value);if(c<0){toast('Plan values cannot be negative.',1);draw();return}D.plan[v]=D.plan[v]||{};D.plan[v][a]=D.plan[v][a]||{};D.plan[v][a][m]=c;audit(`Updated plan ${v} ${a} ${m}`,fmt(c));draw()}
  else if(t.dataset.drv){const v=parseFloat(t.value);if(Number.isFinite(v)&&v>=0&&v<=1e9){D.drv[t.dataset.drv]=v;draw();$('#d-'+t.dataset.drv)?.focus()}else{toast('Drivers must be zero or positive numbers.',1);draw()}}
  else if(t.id==='jc'){const r=$('#jr');r.disabled=t.value==='INR';r.value=t.value==='INR'?1:D.fx.USD;jsum()}
  else if(t.id==='ipo'){const p=D.pos.find(x=>x.id===t.value),q=$('#iq');q.disabled=!p;if(p){q.value=p.qty-p.ir;$('#ip').value=p.vendor;$('#ia').value=((p.qty-p.ir)*p.price/100).toFixed(2);$('#iex').disabled=true}else{q.value='';$('#iex').disabled=false}itot()}
  else if(t.id==='itc')itot()});
window.addEventListener('error',e=>{toast('Unexpected error: '+(e.message||'see console'),1)});
function draw(){
  if(!SESSION){S.page='login';$('#app').innerHTML=loginView();return} // the application is never rendered before authentication
  const sc=$('#main')?.scrollTop;$('#app').innerHTML=S.page==='pub'?pub():shell();const m=$('#main');if(m&&sc)m.scrollTop=sc;save()}
draw();
</script>
