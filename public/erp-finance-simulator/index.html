<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cloud ERP Finance Simulator</title>
<meta name="description" content="A working finance ERP training simulator: planning and analysis, parallel-ledger accounting and close, payables and receivables, GST compliance and treasury — with fictional data saved in your browser.">
<style>
:root{--blue:#0064d9;--blue-d:#0050b3;--hd:#1d2d3e;--ink:#1d2d3e;--mut:#556b82;--line:#e5e5e5;--bg:#f5f6f7;--shell:#1d2d3e;--ok:#188918;--err:#d20a0a;--warn:#c35500;--sh:0 2px 8px rgba(0,0,0,.18);color-scheme:light;font-family:"72",Arial,Helvetica,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:#fff;color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* public page */
.pub-h{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 16px;gap:10px}
.pub-h .t{font-size:16px;line-height:1.2;color:var(--hd)}.pub-h .t b{display:block;font-weight:700}
.mark{background:linear-gradient(135deg,#0a6ed1,#3fa2ff);color:#fff;font-weight:800;font-size:12px;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;letter-spacing:.3px;flex:none}
.ddb{border:0;background:none;color:var(--blue);padding:6px}
.menu{position:absolute;left:12px;top:60px;background:#fff;box-shadow:var(--sh);border-radius:8px;min-width:240px;padding:6px 0;z-index:60}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;color:var(--ink)}
.menu button:hover{background:#eef4fc}
.pub-w{max-width:1040px;margin:0 auto}
.hero{min-height:176px;background:linear-gradient(120deg,#002a86 0%,#0070f2 60%,#4fb3ff 100%);position:relative;overflow:hidden;color:#fff;padding:28px 16px}
.hero h1{margin:0 0 8px;font-size:28px;line-height:1.2;max-width:560px;position:relative;z-index:1}.hero p{margin:0;max-width:520px;position:relative;z-index:1;opacity:.92}
.hero svg{position:absolute;right:-10px;bottom:0;height:100%;opacity:.9}
.intro{padding:24px 16px 8px;font-size:16px;line-height:1.5;max-width:760px}
.link{color:var(--blue);font-weight:700;background:none;border:0;padding:8px 0;font-size:16px}
.acc{border-top:1px solid var(--line)}.accs{border-bottom:1px solid var(--line)}
.acc>button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:18px 16px;font-size:18px;font-weight:700;color:var(--hd)}
.acc>button svg{color:var(--blue);transition:transform .15s}
.acc>button[aria-expanded=true] svg{transform:rotate(90deg)}
.acc .pn{padding:0 16px 22px 46px;font-size:15px;line-height:1.5}
.shot{border:1px solid var(--line);border-radius:4px;background:#f5f8fc;margin:4px 0 12px;overflow:hidden;max-width:560px}
.shot svg{display:block;width:100%;height:auto}
.tn{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.circ{width:40px;height:40px;border-radius:50%;border:1px solid var(--blue);background:#fff;color:var(--blue);display:grid;place-items:center}
.circ:disabled{opacity:.35;cursor:default}.circ:hover:not(:disabled){background:#eef4fc}
.cta{background:#f5f6f7;padding:36px 16px;margin-top:28px}
.cta h2{font-size:22px;line-height:1.3;margin:0 0 18px;color:var(--hd);max-width:560px}
.btn{height:40px;border-radius:8px;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:0 16px;font-weight:700;white-space:nowrap}
.btn:hover:not(:disabled){background:#eef4fc}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover:not(:disabled){background:var(--blue-d)}.btn.g{border-color:#bcc3ca;color:var(--ink)}.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.lg{height:48px;padding:0 28px;font-size:16px}.btn:disabled{opacity:.45;cursor:default}.btn.d{border-color:var(--err);color:var(--err)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:12px;background:var(--blue);color:#fff;border:0;box-shadow:var(--sh);display:grid;place-items:center;z-index:70}
.fab svg.i{width:26px;height:26px}
.panel{position:fixed;right:16px;bottom:84px;width:min(340px,calc(100vw - 32px));background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:71;overflow:hidden}
.panel h3{margin:0;background:var(--blue);color:#fff;padding:12px 16px;font-size:15px}.panel>div{padding:14px 16px;font-size:14px}
.panel .btn{margin:8px 8px 0 0}
/* login */
.login{min-height:100vh;background:var(--bg);display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:24px;width:100%;max-width:460px}
.card h1{font-size:22px;margin:0 0 4px}
.acct{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;margin-top:10px}
.acct:hover{border-color:var(--blue);background:#eef4fc}.acct small{display:block;color:var(--mut)}
.av{width:36px;height:36px;border-radius:50%;background:#d1efff;color:#0040b0;display:grid;place-items:center;font-weight:700;flex:none}
/* shell */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--bg)}
.sb{height:48px;background:var(--shell);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;flex:none}
.sb .mark{width:28px;height:28px;font-size:10px}.sb .ttl{font-weight:700}
.sb select{background:#2c4056;color:#fff;border:0;border-radius:6px;height:30px;padding:0 6px;max-width:190px}
.sb .ib{background:none;border:0;color:#fff;border-radius:6px;padding:6px;position:relative}.sb .ib:hover{background:rgba(255,255,255,.12)}
.bdg{position:absolute;top:0;right:-2px;background:var(--err);font-size:10px;border-radius:8px;padding:0 5px;line-height:15px}
.body{display:flex;flex:1;min-height:0}
.nav{width:244px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px;flex:none}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;text-align:left;color:var(--ink)}
.nav button:hover{background:#eef4fc}.nav button[aria-current=page]{background:#e6f0fc;color:var(--blue);font-weight:700}
.nav h6{margin:14px 12px 4px;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em}
.main{flex:1;overflow:auto;padding:16px 20px 60px;min-width:0}
.bc{font-size:12px;color:var(--mut);margin-bottom:2px}.main h1{font-size:24px;margin:0 0 14px;color:var(--hd)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.inp{height:34px;border:1px solid #89919a;border-radius:6px;padding:0 10px;background:#fff;min-width:0}.inp:focus{border-color:var(--blue)}
textarea.inp{height:auto;padding:8px 10px}
.w{width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #d9d9d9;padding:14px}.tile small{color:var(--mut)}.tile b{display:block;font-size:22px;margin-top:6px}
.tile .sub{font-size:12px;color:var(--mut);margin-top:4px}
.tile.link2{cursor:pointer}.tile.link2:hover{box-shadow:0 0 0 2px var(--blue)}
.sec{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #d9d9d9;margin-bottom:16px;overflow:hidden}
.sec h2{font-size:16px;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pad{padding:14px 16px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:#f5f6f7;text-align:left;font-weight:700;color:var(--mut);white-space:nowrap}th,td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;background:#fafafa}.empty{padding:28px;text-align:center;color:var(--mut)}
td .btn{margin:2px 2px 2px 0}
.st{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap;color:#556b82;background:#f5f6f7;border-color:#bcc3ca}
.st.Submitted,.st.Pending,.st.Warning,.st.In-progress,.st.Partially-received,.st.Unmatched{color:#a04600;background:#fff3e0;border-color:#f0b27a}
.st.Posted,.st.Open,.st.Paid,.st.Pass,.st.Approved,.st.Matched,.st.Closed,.st.Received{color:var(--ok);background:#e9f7e9;border-color:#9ccf9c}
.st.Rejected,.st.Reversed,.st.Fail,.st.Overdue{color:var(--err);background:#fdeaea;border-color:#f0a0a0}
.pos{color:var(--ok)}.neg{color:var(--err)}
dialog{border:0;border-radius:12px;padding:0;max-width:640px;width:calc(100vw - 24px);max-height:calc(100vh - 24px);box-shadow:0 10px 40px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form,dialog .dlgb{padding:20px}dialog h2{margin:0 0 12px;font-size:18px}.fl{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.ln{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-bottom:6px}.ln .inp{width:100%}
.err{color:var(--err);font-size:13px;margin-top:8px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow:auto}.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap}.tabs button[aria-selected=true]{border-color:var(--blue);color:var(--blue);font-weight:700}
.toasts{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:#fff;border-left:4px solid var(--ok);box-shadow:var(--sh);padding:10px 16px;border-radius:6px}.toast.e{border-color:var(--err)}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:14px 16px}
.area{border:1px solid var(--line);border-radius:10px;padding:12px}.area h3{margin:0 0 6px;font-size:14px}.area p{margin:0 0 8px;color:var(--mut);font-size:13px}.area .btn{margin:2px 4px 2px 0}
.tree ul{list-style:none;margin:0;padding-left:26px;border-left:1px dashed #9fb0c2}
.tree>ul{border:0;padding-left:0}.tree li{position:relative;padding-top:6px}
.tree li li::before{content:"";position:absolute;left:-26px;top:26px;width:22px;border-top:1px dashed #9fb0c2}
.node{display:inline-block;background:#fff;border:1px solid #c9d3dd;border-left:4px solid var(--blue);border-radius:8px;padding:6px 10px;min-width:220px}
.node b{display:block;font-size:15px}.node small{color:var(--mut)}.node.in{border-left-color:#e26b0a}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px}
.cal .d{min-height:78px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;overflow:hidden}
.cal .d.x{background:transparent;border-color:transparent}.cal .d.t{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.chip{display:block;border-radius:4px;padding:1px 5px;margin-top:3px;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;width:100%;text-align:left}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:0 16px 12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}.chk:last-child{border-bottom:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.chk .ic.ok{background:#e9f7e9;color:var(--ok)}.chk .ic.no{background:#fff3e0;color:var(--warn)}
.chk .tx{flex:1}.chk .tx small{display:block;color:var(--mut)}
.hm{display:none}
@media(max-width:860px){.nav{position:fixed;top:48px;bottom:0;left:0;z-index:40;box-shadow:var(--sh);transform:translateX(-102%);transition:transform .2s}.nav.open{transform:none}.main{padding:12px 12px 60px}.hm{display:inline-grid!important}.sb .who,.sb .co{display:none}.sb select{max-width:150px}.sb{gap:6px;padding:0 8px}.sb .ttl{display:none}.acc .pn{padding-left:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
/* =====================================================================
   Cloud ERP Finance Simulator — independent training app.
   Fictional data, saved in this browser (localStorage). Money is held as
   integer paise ("cents") so the ledger never accumulates float error.
   ===================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON={chev:'<path d="M9 6l6 6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',prev:'<path d="M15 6l-6 6 6 6"/>',next:'<path d="M9 6l6 6-6 6"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',home:'<path d="M3 11l9-7 9 7v9H3z"/>',book:'<path d="M5 4h12a2 2 0 012 2v14H7a2 2 0 01-2-2zM5 18a2 2 0 012-2h12"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',ok:'<path d="M5 12l5 5 9-10"/>',inv:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',chart:'<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-8"/>',audit:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20h4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',plan:'<path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',bank:'<path d="M3 10l9-6 9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const toast=(m,e)=>{const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),e?4500:3000)};
const cents=v=>{const n=parseFloat(String(v??'').replace(/[,₹\s]/g,''));return Number.isFinite(n)?Math.round(n*100):0};
const fmt=c=>(c/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=c=>Math.round(c/100).toLocaleString('en-IN');
const sgn=c=>`<span class="${c<0?'neg':c>0?'pos':''}">${fmt(c)}</span>`;
const sum=(a,k)=>a.reduce((s,x)=>s+(k?(x[k]||0):x),0);
const per=d=>String(d||'').slice(0,7);
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const lastDay=p=>{const[y,m]=p.split('-').map(Number);return new Date(Date.UTC(y,m,0)).toISOString().slice(0,10)};
const prevP=p=>{const[y,m]=p.split('-').map(Number);const d=new Date(Date.UTC(y,m-2,1));return d.toISOString().slice(0,7)};
const mName=m=>new Date(m+'-01T00:00:00Z').toLocaleString('en-IN',{month:'short',year:'numeric',timeZone:'UTC'});
const isDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');

/* ===== master data ===== */
const ACCTS=[['100000','Bank – HDFC Current','A'],['100100','Bank – ICICI Collections','A'],['110000','Accounts Receivable','A'],['115000','Input GST Receivable','A'],['120000','Fixed Assets (net)','A'],['140000','Inventory','A'],['200000','Accounts Payable','L'],['210000','GR/IR Clearing','L'],['220000','Output GST Payable','L'],['300000','Share Capital','E'],['400000','Sales Revenue','R'],['410000','Interest Income','R'],['500000','Cost of Goods Sold','X'],['510000','Operating Expenses','X'],['520000','Salaries and Wages','X'],['530000','Depreciation','X']].map(([code,name,type])=>({code,name,type}));
const A=c=>ACCTS.find(a=>a.code===c);
const accName=c=>{const a=A(c);return a?`${a.code} ${a.name}`:c};
const acctOpts=(sel,filter)=>ACCTS.filter(a=>!filter||filter.includes(a.code)).map(a=>`<option value="${a.code}" ${a.code===sel?'selected':''}>${a.code} ${esc(a.name)}</option>`).join('');
const BANKS=[{gl:'100000',name:'HDFC Current ••4521'},{gl:'100100',name:'ICICI Collections ••7788'}];
const bankName=g=>BANKS.find(b=>b.gl===g)?.name||g;
const LEDGERS={'0L':'0L – IFRS (leading)','2L':'2L – Local GAAP'};
const PLACC=['400000','410000','500000','510000','520000','530000'];
const MONTHS=['2026-10','2026-11','2026-12'];
const VERSIONS=['Budget','Forecast','Simulation'];
const VCOL={Actual:'#1d2d3e',Budget:'#0a6ed1',Forecast:'#7bb8ff',Simulation:'#e26b0a'};
const USERS=[{id:'asha',name:'Asha Student',role:'Student',desc:'Prepares journals, invoices, purchase orders and plan inputs'},{id:'ravi',name:'Ravi Instructor',role:'Instructor',desc:'Reviews, approves and posts; runs payments and the close'},{id:'meera',name:'Meera Admin',role:'Administrator',desc:'Full access: periods, tax codes, FX rates and data reset'}];
const CAN={create:['Student','Administrator'],approve:['Instructor','Administrator'],admin:['Administrator']};
const can=k=>!!S.user&&CAN[k].includes(S.user.role);
const need=(k,msg)=>{if(!can(k))throw Error(msg||`Your role (${S.user.role}) cannot do this.`)};

/* ===== data ===== */
let D,SEEDING=false;
function blank(){return {v:2,periods:[{id:'2026-09',open:false},{id:'2026-10',open:true},{id:'2026-11',open:true},{id:'2026-12',open:true}],journals:[],invoices:[],pos:[],stmt:[],stmtOpen:{},flows:[],tasks:[],audit:[],close:{},gst:{},seq:1000,iseq:{AR:0,AP:0},poseq:4500000,tseq:0,sseq:0,fseq:0,keyDate:'2026-10-15',fx:{USD:83.25},minCash:cents(200000),dep:{'0L':cents(8000),'2L':cents(12000)},
  tax:[{code:'G18',desc:'GST 18% (standard)',rate:1800},{code:'G12',desc:'GST 12%',rate:1200},{code:'G5',desc:'GST 5%',rate:500},{code:'G0',desc:'GST exempt / nil rated',rate:0}],
  plan:{},drv:{units:250,unitGrowth:5,price:1600,cogsPct:52,headcount:2,salary:47500,opexBase:150000,opexGrowth:1,dep:8000}}}
function audit(act,ref,by){D.audit.unshift({t:new Date().toLocaleString('en-IN'),by:by||S.user?.name||'system',act,ref:ref||''})}
function mkJ(o){const j={id:'JE'+(++D.seq),desc:o.desc,date:o.date,ledger:o.ledger||'ALL',cur:o.cur||'INR',rate:o.rate||1,tx:o.tx||null,lines:o.lines,status:o.status||'Draft',by:o.by||S.user?.name||'system',approver:o.approver||null,src:o.src||'Manual',rev:null,revOf:null};D.journals.push(j);return j}
const L=(acc,dr,cr)=>({acc,dr:dr||0,cr:cr||0});

/* ===== accounting engine ===== */
const live=j=>j.status==='Posted'||j.status==='Reversed'; // a reversed entry stays in the books next to its reversal
const inLedger=(j,l)=>live(j)&&(j.ledger==='ALL'||j.ledger===l);
const jTotal=j=>sum(j.lines,'dr');
function problems(j){
  const e=[];
  if(!String(j.desc||'').trim())e.push('Description is required.');
  if(!isDate(j.date))e.push('Posting date is required.');
  if(j.lines.length<2)e.push('At least two lines are required.');
  j.lines.forEach((l,i)=>{if(!A(l.acc))e.push(`Line ${i+1}: choose a valid account.`);if(l.dr<0||l.cr<0)e.push(`Line ${i+1}: negative amounts are not allowed.`);if((l.dr>0)===(l.cr>0))e.push(`Line ${i+1}: enter either a debit or a credit.`)});
  const dr=sum(j.lines,'dr'),cr=sum(j.lines,'cr');
  if(dr!==cr)e.push(`Not balanced: debits ${fmt(dr)} ≠ credits ${fmt(cr)}.`);
  if(isDate(j.date)){const p=D.periods.find(p=>p.id===per(j.date));if(!p||!p.open)e.push(`Posting period ${per(j.date)} is closed or does not exist.`)}
  return e;
}
function post(j){ // manual journals: validate everything first, then change state once
  if(live(j))throw Error('Already posted – duplicate posting blocked.');
  need('approve','Your role cannot post journals.');
  if(j.by===S.user.name&&S.user.role!=='Administrator')throw Error('Separation of duties: you cannot approve your own entry.');
  const e=problems(j);if(e.length)throw Error(e[0]);
  j.status='Posted';j.approver=S.user.name;audit('Posted journal',j.id);
}
function autoPost(desc,date,lines,src,extra){ // system postings from operational transactions
  lines=lines.filter(l=>l.dr||l.cr);
  if(!SEEDING){const e=problems({desc,date,lines});if(e.length)throw Error(e[0])}
  const j=mkJ({desc,date,lines,src,status:'Posted',by:S.user?.name||'system',approver:S.user?.name||'system',...(extra||{})});
  if(!SEEDING)audit(`Posted ${src.toLowerCase()}`,j.id);return j;
}
function toLocal(tx,rate){ // convert transaction-currency lines, push any rounding paisa onto the largest debit
  const out=tx.map(l=>({acc:l.acc,dr:Math.round(l.dr*rate),cr:Math.round(l.cr*rate)}));
  const diff=sum(out,'dr')-sum(out,'cr');
  if(diff){let k=0;out.forEach((l,i)=>{if(l.dr>out[k].dr)k=i});out[k].dr-=diff}
  return out;
}
function bal(o){o=o||{};const l=o.ledger||'0L',b={};ACCTS.forEach(a=>b[a.code]=0);
  D.journals.forEach(j=>{if(!inLedger(j,l))return;if(o.to&&j.date>o.to)return;if(o.from&&j.date<o.from)return;if(o.months&&!o.months.includes(per(j.date)))return;if(o.exclude&&o.exclude.includes(j.src))return;j.lines.forEach(x=>b[x.acc]+=x.dr-x.cr)});return b}
const nat=(c,v)=>{const t=A(c).type;return t==='A'||t==='X'?v:-v};
function totals(o){const b=bal(o),t={A:0,L:0,E:0,R:0,X:0};ACCTS.forEach(a=>t[a.type]+=nat(a.code,b[a.code]));t.np=t.R-t.X;t.b=b;return t}
const cashTotal=o=>BANKS.reduce((s,k)=>s+bal(o)[k.gl],0);
const pendingCount=()=>D.journals.filter(j=>j.status==='Submitted').length+D.invoices.filter(i=>i.status==='Pending').length+D.tasks.filter(t=>t.status==='Submitted').length;
const taxCode=c=>D.tax.find(t=>t.code===c);
const calcTax=(net,code)=>Math.round(net*(taxCode(code)?.rate||0)/10000);

/* ===== planning ===== */
function simulate(d){const out={};PLACC.forEach(a=>out[a]={});
  MONTHS.forEach((m,i)=>{const units=d.units*Math.pow(1+d.unitGrowth/100,i),rev=Math.round(units*d.price*100);
    out['400000'][m]=rev;out['410000'][m]=0;out['500000'][m]=Math.round(rev*d.cogsPct/100);
    out['520000'][m]=Math.round(d.headcount*d.salary*100);out['510000'][m]=Math.round(d.opexBase*Math.pow(1+d.opexGrowth/100,i)*100);out['530000'][m]=Math.round(d.dep*100)});return out}
function actuals(months){const b=bal({ledger:'0L',months}),o={};PLACC.forEach(a=>o[a]=nat(a,b[a]));return o}
const planOf=(v,months)=>{const o={};PLACC.forEach(a=>o[a]=sum(months.map(m=>D.plan[v]?.[a]?.[m]||0)));return o};
const roll=o=>{const rev=o['400000']+o['410000'],exp=o['500000']+o['510000']+o['520000']+o['530000'];return {rev,exp,oi:rev-exp}};

/* ===== GR/IR ===== */
function grir(p){const d=p.grVal-p.irVal-p.adj;
  if(!p.gr&&!p.ir)return {s:'Awaiting delivery',hint:'No goods receipt or invoice yet.',d};
  if(p.ir>p.gr)return {s:'Invoiced, not received',hint:`Supplier billed ${p.ir-p.gr} unit(s) not yet received – follow up with ${p.vendor} or block payment.`,d,bad:true};
  if(p.gr>p.ir)return {s:'Received, not invoiced',hint:`${p.gr-p.ir} unit(s) received and accrued in GR/IR; waiting for the supplier invoice. No action needed.`,d};
  if(d!==0)return {s:'Price difference',hint:`Quantities match but the invoice is ₹${fmt(Math.abs(d))} ${d<0?'above':'below'} the PO price. Proposed: clear to 510000 Operating Expenses.`,d,bad:true,clear:true};
  return {s:p.gr===p.qty?'Matched':'Matched (partial)',hint:'GR and IR agree.',d};
}

/* ===== tax ===== */
function gstFor(p){ // movement in the period, excluding settlement postings
  const b=bal({months:[p],exclude:['GST settlement']}),out=-b['220000'],inp=b['115000'],bf=D.gst[prevP(p)]?.cf||0;
  const avail=inp+bf,pay=Math.max(0,out-avail),cf=Math.max(0,avail-out);return {out,inp,bf,pay,cf,used:Math.min(out,avail)};
}

/* ===== bank reconciliation ===== */
function bookLines(bank){const out=[];D.journals.forEach(j=>{if(!inLedger(j,'0L'))return;j.lines.forEach((l,i)=>{if(l.acc===bank)out.push({key:j.id+':'+i,j,amt:l.dr-l.cr,date:j.date})})});return out}
const usedKeys=()=>new Set(D.stmt.filter(s=>s.match).map(s=>s.match));
function autoMatch(){let n=0;const used=usedKeys();
  D.stmt.filter(s=>!s.match).forEach(s=>{const c=bookLines(s.bank).filter(b=>!used.has(b.key)&&b.amt===s.amt&&Math.abs(daysBetween(b.date,s.date))<=7).sort((a,b)=>Math.abs(daysBetween(a.date,s.date))-Math.abs(daysBetween(b.date,s.date)))[0];if(c){s.match=c.key;used.add(c.key);n++}});return n}

/* ===== close ===== */
function closeChecks(p){const end=lastDay(p),c=D.close[p]||{};
  const open=D.journals.filter(j=>per(j.date)===p&&(j.status==='Draft'||j.status==='Submitted'));
  const pinv=D.invoices.filter(i=>per(i.date)===p&&i.status==='Pending');
  const um=D.stmt.filter(s=>s.date<=end&&!s.match);
  const gbad=D.pos.filter(x=>grir(x).bad);
  const dep=['0L','2L'].filter(l=>!D.journals.some(j=>j.src==='Depreciation'&&live(j)&&per(j.date)===p&&j.ledger===l));
  const g=gstFor(p),gOk=!!D.gst[p]||(g.out===0&&g.inp===0&&!g.bf);
  const tb=['0L','2L'].every(l=>{const b=bal({ledger:l,to:end});return sum(Object.values(b))===0});
  return [
   {k:'jr',label:'All journals in the period are posted or rejected',ok:!open.length,detail:open.length?`${open.length} open: ${open.map(j=>j.id).join(', ')}`:'No drafts or submitted entries.',go:'journals'},
   {k:'inv',label:'No invoices waiting for approval',ok:!pinv.length,detail:pinv.length?pinv.map(i=>i.id).join(', '):'Inbox is clear for this period.',go:'approvals'},
   {k:'dep',label:'Depreciation run posted in both ledgers (0L and 2L)',ok:!dep.length,detail:dep.length?`Missing in ${dep.join(' and ')}.`:'Ledger-specific depreciation posted.',run:'dep'},
   {k:'grir',label:'GR/IR exceptions cleared',ok:!gbad.length,detail:gbad.length?gbad.map(x=>`${x.id}: ${grir(x).s}`).join('; '):'No price or quantity exceptions.',go:'po'},
   {k:'bank',label:`Bank statements reconciled up to ${end}`,ok:!um.length,detail:um.length?`${um.length} unmatched statement line(s).`:'All statement lines matched.',go:'cash',tab:'rec'},
   {k:'gst',label:'GST for the period settled',ok:gOk,detail:gOk?(D.gst[p]?`Settled in ${D.gst[p].je}.`:'No GST activity.'):`Net payable ₹${fmt(g.pay)}${g.cf?`, credit to carry forward ₹${fmt(g.cf)}`:''}.`,go:'tax',tab:'gst'},
   {k:'tb',label:'Trial balance balances in every ledger',ok:tb,detail:tb?'Debits equal credits in 0L and 2L.':'Out of balance.',go:'reports'},
   {k:'accr',label:'Accruals and provisions reviewed',ok:!!c.accr,detail:c.accr?`Confirmed by ${c.accr.by} · ${c.accr.t}`:'Manual sign-off required.',manual:true},
   {k:'rev',label:'Management review of P&L and balance sheet',ok:!!c.rev,detail:c.rev?`Confirmed by ${c.rev.by} · ${c.rev.t}`:'Manual sign-off required.',manual:true}];
}

cmp(){const months=S.cmp==='Q'?MONTHS:[S.cmp],series=[['Actual',roll(actuals(months))],...VERSIONS.map(v=>[v,roll(planOf(v,months))])];

cal(){const m=S.calM,[y,mo]=m.split('-').map(Number),first=new Date(Date.UTC(y,mo-1,1)).getUTCDay(),days=new Date(Date.UTC(y,mo,0)).getUTCDate(),off=(first+6)%7,me=S.user.name;

const TAX={
gst(){const p=S.gstP,g=gstFor(p),done=D.gst[p];
  const inv=D.invoices.filter(i=>per(i.date)===p&&(i.status==='Open'||i.status==='Paid'));
  const by={};inv.forEach(i=>{const k=i.type+'|'+i.taxCode;by[k]=by[k]||{type:i.type,code:i.taxCode,n:0,net:0,tax:0};by[k].n++;by[k].net+=i.net;by[k].tax+=i.tax});

   <div class="pad">${done?`${stat('Settled')} <span class="note">in ${done.je} on ${done.date} by ${esc(done.by)}</span>`:`<button class="btn p sm" data-a="settlegst" ${can('approve')?'':'disabled'}>Post settlement${g.pay?` – pay ₹${fmt(g.pay)} from HDFC`:''}</button>${D.gst[prevP(p)]||!D.periods.some(x=>x.id===prevP(p))?'':`<p class="note">Settle ${mName(prevP(p))} first.</p>`}`}</div></div></div>
  <p class="note">The settlement offsets input tax against output tax, pays the balance from the HDFC account on the key date and carries any excess credit into the next period. Figures come from the ledger (0L), excluding earlier settlement postings.</p>`},
codes(){return `<div class="sec">${tbl(['Code','Description','Rate','Used on invoices'],D.tax.map(t=>[t.code,esc(t.desc),(t.rate/100).toFixed(2)+'%',D.invoices.filter(i=>i.taxCode===t.code).length]),[2,3])}</div>
  ${can('admin')?`<div class="sec"><h2>Add tax code</h2><div class="pad tools"><input class="inp" id="tcc" placeholder="Code e.g. G28" maxlength="6" aria-label="Code"><input class="inp" id="tcd" placeholder="Description" aria-label="Description"><input class="inp" id="tcr" placeholder="Rate %" inputmode="decimal" style="width:90px" aria-label="Rate"><button class="btn sm p" data-a="addtax">Add</button></div></div>`:'<p class="note">Tax codes are maintained by the Administrator.</p>'}<p class="note">Rates are fixed once a code is used, so posted tax always matches its code.</p>`},
ctl(){const posted=D.journals.filter(live),ub=posted.filter(j=>sum(j.lines,'dr')!==sum(j.lines,'cr'));

  const closedOpen=D.journals.filter(j=>(j.status==='Draft'||j.status==='Submitted')&&!D.periods.find(p=>p.id===per(j.date))?.open);

/* --- treasury tabs --- */
function forecast(){const start=D.keyDate,wk=[];let open=cashTotal({to:start});
  const items=[...D.invoices.filter(i=>i.status==='Open'||i.status==='Pending').map(i=>({date:i.due,amt:i.type==='AR'?i.gross:-i.gross,k:i.type==='AR'?'in':'out',pend:i.status==='Pending'})),...D.flows.map(f=>({date:f.date,amt:f.amt,k:'plan'}))];
  for(let w=0;w<6;w++){const from=addDays(start,w*7+1),to=addDays(start,w*7+7);const its=items.filter(x=>w===0?x.date<=to:x.date>=from&&x.date<=to);
    const r={from,to,open,inn:sum(its.filter(x=>x.k==='in'),'amt'),out:sum(its.filter(x=>x.k==='out'),'amt'),plan:sum(its.filter(x=>x.k==='plan'),'amt')};r.close=r.open+r.inn+r.out+r.plan;open=r.close;wk.push(r)}return wk}
const CASH={
pos(){const b=bal({to:D.keyDate}),inn=D.invoices.filter(i=>i.type==='AR'&&i.status==='Open'),out=D.invoices.filter(i=>i.type==='AP'&&i.status==='Open');
  const st=g=>D.stmtOpen[g]+sum(D.stmt.filter(s=>s.bank===g),'amt');
  return `<div class="tiles">${BANKS.map(k=>`<div class="tile"><small>${k.name}</small><b>₹ ${fmt0(b[k.gl])}</b><div class="sub">Statement ₹ ${fmt0(st(k.gl))} · ${D.stmt.filter(s=>s.bank===k.gl&&!s.match).length} unmatched</div></div>`).join('')}<div class="tile"><small>Total cash</small><b>₹ ${fmt0(cashTotal({to:D.keyDate}))}</b><div class="sub">as at ${D.keyDate}</div></div><div class="tile"><small>Expected receipts</small><b class="pos">₹ ${fmt0(sum(inn,'gross'))}</b><div class="sub">${inn.length} open customer invoices</div></div><div class="tile"><small>Committed payments</small><b class="neg">₹ ${fmt0(sum(out,'gross'))}</b><div class="sub">${out.length} approved supplier invoices</div></div></div>

function approveInvoice(i){

  if(i.by===S.user.name&&S.user.role!=='Administrator')throw Error('Separation of duties: you cannot approve your own invoice.');
  let p=null;if(i.po){p=D.pos.find(x=>x.id===i.po);if(p.ir+i.qty>p.qty)throw Error(`PO ${p.id} only has ${p.qty-p.ir} unit(s) left to invoice.`)}
  const ls=i.type==='AR'?[L('110000',i.gross,0),L('400000',0,i.net),L('220000',0,i.tax)]:[L(p?'210000':i.exp,i.net,0),L('115000',i.tax,0),L('200000',0,i.gross)];
  const j=autoPost(`Invoice ${i.id} – ${i.party}`,i.date,ls,'Invoice');i.status='Open';i.je=j.id;if(p){p.ir+=i.qty;p.irVal+=i.net}audit('Approved invoice',i.id);
}
function act(el){const a=el.dataset.a,id=el.dataset.id;
 try{switch(a){
  /* public */
  case'acc':{const i=+el.dataset.i;if(el.dataset.only){S.acc={};S.acc[i]=true;S.menu=false;S.chat=false;draw();$('#p'+i)?.scrollIntoView({behavior:'smooth',block:'start'});return}S.acc[i]=!S.acc[i];break}
  case'next':case'prev':{const i=+el.dataset.i;S.step[i]=Math.max(0,Math.min(CATS[i].steps.length-1,(S.step[i]||0)+(a==='next'?1:-1)));break}
  case'menu':S.menu=!S.menu;break;case'chat':S.chat=!S.chat;break;
  case'try':S.after={v:el.dataset.v,t:el.dataset.t};if(S.user){S.page='app';goView(S.after.v,S.after.t);S.after=null}else S.page='login';S.menu=S.chat=false;window.scrollTo(0,0);break;
  case'launch':closeDlg();S.menu=S.chat=false;S.page=S.user?'app':'login';window.scrollTo(0,0);break;
  case'home':S.page='pub';S.nav=false;window.scrollTo(0,0);break;
  case'login':S.user=USERS.find(u=>u.id===el.dataset.u);S.page='app';audit('Signed in','session');if(S.after){goView(S.after.v,S.after.t);S.after=null}else S.view='home';break;
  case'logout':audit('Signed out','session');S.user=null;S.page='pub';break;
  /* shell */
  case'view':goView(el.dataset.v,el.dataset.t);break;case'nav':S.nav=!S.nav;break;
  case'tab':S.tabs[el.dataset.v]=el.dataset.k;break;
  case'close':closeDlg();return;
  /* journals */
  case'newj':need('create','Your role cannot create journals.');openJ();return;
  case'addline':$('#jlines').insertAdjacentHTML('beforeend',lineRow());return;
  case'savej':saveJ(el.dataset.s);return;
  case'viewj':viewJ(id);return;
  case'subj':{const j=findJ(id);if(j.status!=='Draft')throw Error('Only drafts can be submitted.');const e=problems(j);if(e.length)throw Error(e[0]);j.status='Submitted';audit('Submitted journal',id);toast(id+' submitted for approval');break}
  case'delj':{const j=findJ(id);if(j.status!=='Draft'||j.by!==S.user.name)throw Error('Only your own drafts can be deleted.');D.journals=D.journals.filter(x=>x!==j);audit('Deleted draft',id);toast(id+' deleted');break}
  case'appj':{const j=findJ(id);post(j);closeDlg();toast(id+' posted');break}
  case'rejj':{need('approve');const j=findJ(id);if(j.status!=='Submitted')throw Error('Only submitted entries can be rejected.');const r=prompt('Rejection reason (required):');if(!r?.trim())throw Error('A rejection reason is required.');j.status='Rejected';audit('Rejected journal – '+r.trim(),id);toast(id+' rejected');break}
  case'revj':{need('approve');const j=findJ(id);if(j.status!=='Posted'||j.rev)throw Error('This entry cannot be reversed.');
    const d=D.periods.find(p=>p.id===per(j.date))?.open?j.date:D.keyDate;
    const r=autoPost('Reversal of '+j.id+' – '+j.desc,d,j.lines.map(l=>L(l.acc,l.cr,l.dr)),'Reversal',{ledger:j.ledger,cur:j.cur,rate:j.rate,tx:j.tx?j.tx.map(l=>L(l.acc,l.cr,l.dr)):null});
    r.revOf=j.id;j.rev=r.id;j.status='Reversed';audit('Reversed journal',j.id);toast(`${j.id} reversed by ${r.id}${d!==j.date?' (posted on key date – original period closed)':''}`);break}
  case'csv':{const rows=[['Date','Entry','Ledger','Account','Description','Debit','Credit']];D.journals.filter(j=>inLedger(j,S.ledger)).forEach(j=>j.lines.forEach(l=>{if(!S.fa||S.fa===l.acc)rows.push([j.date,j.id,S.ledger,l.acc,'"'+j.desc.replace(/"/g,'""')+'"',(l.dr/100).toFixed(2),(l.cr/100).toFixed(2)])}));const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));x.download=`ledger-${S.ledger}.csv`;x.click();return}
  /* invoices */
  case'newi':need('create','Your role cannot create invoices.');openI(el.dataset.t);return;
  case'savei':{const t=el.dataset.t,party=$('#ip').value.trim(),net=cents($('#ia').value),code=$('#itc').value,date=$('#idt').value,due=$('#idd').value,po=t==='AP'?$('#ipo').value:'',qty=po?parseInt($('#iq').value,10):0;
    const err=m=>{$('#ie').textContent=m};
    if(!party)return err('Enter the '+(t==='AR'?'customer':'supplier')+' name.');if(net<=0)return err('Enter a net amount greater than zero.');if(!isDate(date)||!isDate(due))return err('Enter invoice and due dates.');if(due<date)return err('Due date cannot be before the invoice date.');
    if(po){const p=D.pos.find(x=>x.id===po);if(!(qty>0)||qty>p.qty-p.ir)return err(`Quantity must be between 1 and ${p.qty-p.ir}.`)}
    const dup=D.invoices.find(i=>i.type===t&&i.status!=='Rejected'&&i.party.toLowerCase()===party.toLowerCase()&&i.net===net&&i.date===date);if(dup)return err(`Possible duplicate of ${dup.id} – same party, amount and date.`);
    const tax=calcTax(net,code),i={id:`${t}-${++D.iseq[t]}`,type:t,party,net,taxCode:code,tax,gross:net+tax,date,due,status:'Pending',by:S.user.name,exp:t==='AP'?$('#iex').value:null,po:po||null,qty};
    D.invoices.push(i);audit('Submitted invoice',i.id);closeDlg();toast(`${i.id} submitted for approval`);break}
  case'appi':approveInvoice(findI(id));toast(id+' approved and posted');break;
  case'reji':{need('approve');const i=findI(id);if(i.status!=='Pending')throw Error('Only pending invoices can be rejected.');const r=prompt('Rejection reason (required):');if(!r?.trim())throw Error('A rejection reason is required.');i.status='Rejected';audit('Rejected invoice – '+r.trim(),id);toast(id+' rejected');break}
  case'settle':{const i=findI(id);if(i.status!=='Open')throw Error('Already settled – duplicate payment blocked.');
    if(i.type==='AP')need('approve','Payments need the Instructor or Administrator role.');
    const j=i.type==='AR'?autoPost(`Receipt for ${i.id} – ${i.party}`,D.keyDate,[L('100100',i.gross,0),L('110000',0,i.gross)],'Customer receipt'):autoPost(`Payment of ${i.id} – ${i.party}`,D.keyDate,[L('200000',i.gross,0),L('100000',0,i.gross)],'Payment');
    i.status='Paid';i.payJe=j.id;audit(i.type==='AR'?'Recorded receipt':'Paid invoice',id);toast(`${id} settled (${j.id})`);break}
  case'payrun':{need('approve');const by=$('#prd').value,bank=$('#prb').value,its=D.invoices.filter(i=>i.type==='AP'&&i.status==='Open'&&i.due<=by);
    if(!its.length)throw Error('No approved supplier invoices are due by '+by+'.');
    dlg(`<form id="prf"><h2>Payment proposal</h2><p class="note" style="margin-top:0">Due by ${by} · paid from ${bankName(bank)} on ${D.keyDate}</p>${tbl(['','Invoice','Supplier','Due','Amount (₹)'],its.map(i=>[`<input type="checkbox" checked value="${i.id}" aria-label="Include ${i.id}">`,i.id,esc(i.party),i.due,fmt(i.gross)]),[4])}<div class="err" id="pre"></div><div class="ft"><button type="button" class="btn g" data-a="close">Cancel</button><button type="button" class="btn p" data-a="execpay" data-b="${bank}">Execute payments</button></div></form>`);return}
  case'execpay':{need('approve');const ids=$$('#prf input:checked').map(x=>x.value),its=D.invoices.filter(i=>ids.includes(i.id)&&i.status==='Open');if(!its.length){$('#pre').textContent='Select at least one invoice.';return}
    const tot=sum(its,'gross'),j=autoPost(`Payment run ${D.keyDate} – ${its.length} invoice(s)`,D.keyDate,[L('200000',tot,0),L(el.dataset.b,0,tot)],'Payment run');
    its.forEach(i=>{i.status='Paid';i.payJe=j.id});audit(`Payment run paid ${its.map(i=>i.id).join(', ')}`,j.id);closeDlg();toast(`Paid ${its.length} invoice(s) – ₹${fmt(tot)} (${j.id})`);break}
  /* purchasing */
  case'newpo':need('create','Your role cannot create purchase orders.');openPO();return;
  case'savepo':{const v=$('#pv').value.trim(),it=$('#pi').value.trim(),q=parseInt($('#pq').value,10),pr=cents($('#pp').value);if(!v||!it||!(q>0)||pr<=0){$('#pe').textContent='Enter supplier, item, a whole quantity and a unit price.';return}
    const p={id:String(++D.poseq),vendor:v,item:it,qty:q,price:pr,gr:0,ir:0,grVal:0,irVal:0,adj:0,date:D.keyDate,by:S.user.name};D.pos.push(p);audit('Created purchase order',p.id);closeDlg();toast(`PO ${p.id} created`);break}
  case'gr':{const p=D.pos.find(x=>x.id===id),open=p.qty-p.gr,r=prompt(`Quantity received for PO ${p.id} (max ${open}):`,String(open));if(r===null)return;const q=parseInt(r,10);if(!(q>0)||q>open)throw Error(`Enter a whole quantity between 1 and ${open}.`);
    const v=q*p.price;autoPost(`Goods receipt PO ${p.id} – ${p.item}`,D.keyDate,[L('140000',v,0),L('210000',0,v)],'Goods receipt');p.gr+=q;p.grVal+=v;toast(`Goods receipt posted: ${q} × ${p.item}`);break}
  case'clrgr':{need('approve');const p=D.pos.find(x=>x.id===id),g=grir(p);if(!g.clear)throw Error('Nothing to clear on this PO.');const d=g.d;
    autoPost(`GR/IR price difference PO ${p.id}`,D.keyDate,d>0?[L('210000',d,0),L('510000',0,d)]:[L('510000',-d,0),L('210000',0,-d)],'GR/IR clearing');p.adj+=d;toast(`PO ${p.id} cleared (₹${fmt(Math.abs(d))})`);break}
  /* close */
  case'rundep':{need('approve','Only Instructor or Administrator can run depreciation.');const p=S.closeP,d=lastDay(p);let n=0;
    ['0L','2L'].forEach(l=>{if(D.journals.some(j=>j.src==='Depreciation'&&live(j)&&per(j.date)===p&&j.ledger===l))return;autoPost(`Depreciation ${p} – ${l==='0L'?'IFRS useful life':'Local GAAP rates'}`,d,[L('530000',D.dep[l],0),L('120000',0,D.dep[l])],'Depreciation',{ledger:l});n++});
    toast(n?`Depreciation posted in ${n} ledger(s)`:'Depreciation already posted');break}
  case'signoff':{need('approve','Sign-off needs the Instructor or Administrator role.');const p=S.closeP,k=el.dataset.k;D.close[p]=D.close[p]||{};if(D.close[p][k]){delete D.close[p][k];audit('Withdrew close sign-off '+k,p)}else{D.close[p][k]={by:S.user.name,t:new Date().toLocaleString('en-IN')};audit('Close sign-off '+k,p)}break}
  case'closeper':{need('approve');const p=S.closeP,ch=closeChecks(p);if(ch.some(c=>!c.ok))throw Error('Complete every checklist item first.');D.periods.find(x=>x.id===p).open=false;audit('Closed period',p);toast(`${mName(p)} closed`);break}
  case'tper':{need('approve');const p=D.periods.find(x=>x.id===id);p.open=!p.open;audit((p.open?'Reopened':'Closed')+' period',id);toast(`Period ${id} ${p.open?'reopened':'closed'}`);break}
  case'aper':{need('admin');const v=$('#np').value.trim();if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(v))throw Error('Use the format YYYY-MM.');if(D.periods.some(p=>p.id===v))throw Error('Period already exists.');D.periods.push({id:v,open:true});D.periods.sort((a,b)=>a.id<b.id?-1:1);audit('Added period',v);toast('Period added');break}
  case'setkd':{const v=$('#kd').value;if(!isDate(v))throw Error('Choose a date.');D.keyDate=v;audit('Changed key date',v);toast('Key date set to '+v);break}
  case'reset':{need('admin');if(!confirm('Reset all training data?'))return;const u=S.user;seed();S.user=u;audit('Reset training data','all');toast('Training data reset');break}
  /* planning */
  case'copyv':{const f=$('#cpf').value,t=S.ver;if(f===t)throw Error('Choose a different source version.');D.plan[t]=JSON.parse(JSON.stringify(D.plan[f]));audit(`Copied plan ${f} → ${t}`,t);toast(`${f} copied into ${t}`);break}
  case'savesim':{const v=$('#dv').value;D.plan[v]=simulate(D.drv);audit('Saved driver simulation to '+v,v);toast(`Simulation saved to ${v} – see Version comparison`);break}
  case'calm':{const i=MONTHS.indexOf(S.calM)+ +el.dataset.d;if(MONTHS[i])S.calM=MONTHS[i];break}
  case'newtask':openTask();return;
  case'edtask':openTask(D.tasks.find(t=>t.id===id));return;
  case'savetask':{const title=$('#kt').value.trim(),due=$('#kd2').value;if(!title||!isDate(due)){$('#ke').textContent='Enter a title and a due date.';return}const v={title,type:$('#kty').value,due,assignee:$('#ka').value,reviewer:$('#kr').value};
    if(v.assignee===v.reviewer){$('#ke').textContent='Assignee and reviewer must be different people.';return}
    if(id){Object.assign(D.tasks.find(t=>t.id===id),v);audit('Updated planning task',id)}else{const t={id:'T'+(++D.tseq),...v,status:'Open'};D.tasks.push(t);audit('Created planning task',t.id)}S.calM=MONTHS.includes(per(due))?per(due):S.calM;closeDlg();toast('Task saved');break}
  case'deltask':D.tasks=D.tasks.filter(t=>t.id!==id);audit('Deleted planning task',id);closeDlg();toast('Task deleted');break;
  case'task':{const t=D.tasks.find(x=>x.id===id),s=el.dataset.s,me=S.user.name;
    const okMove=(t.status==='Open'&&s==='In progress'&&t.assignee===me)||(t.status==='In progress'&&s==='Submitted'&&t.assignee===me)||(t.status==='Submitted'&&(s==='Approved'||s==='In progress')&&(t.reviewer===me||can('admin')));
    if(!okMove)throw Error('Only the assignee or reviewer can move this task.');t.status=s;audit(`Planning task → ${s}`,id);toast(`${t.title}: ${s}`);break}
  /* tax */
  case'settlegst':{need('approve');const p=S.gstP;if(D.gst[p])throw Error('Already settled.');const pp=prevP(p);if(D.periods.some(x=>x.id===pp)&&!D.gst[pp]){const g0=gstFor(pp);if(g0.out||g0.inp||g0.bf)throw Error(`Settle ${mName(pp)} first.`)}
    const g=gstFor(p);if(!g.out&&!g.inp&&!g.bf)throw Error('No GST activity in this period.');
    const ls=[L('220000',g.out,0),L('115000',0,g.used),L('100000',0,g.pay)];let j=null;
    if(g.out)j=autoPost(`GST settlement for ${p}`,D.keyDate,ls,'GST settlement');
    D.gst[p]={je:j?j.id:'—',date:D.keyDate,by:S.user.name,cf:g.cf,pay:g.pay};audit('Settled GST',p);toast(g.pay?`GST paid ₹${fmt(g.pay)}`:`No payment due – ₹${fmt(g.cf)} credit carried forward`);break}
  case'addtax':{need('admin');const c=$('#tcc').value.trim().toUpperCase(),d=$('#tcd').value.trim(),r=parseFloat($('#tcr').value);if(!/^[A-Z0-9]{1,6}$/.test(c)||!d||!(r>=0&&r<=100))throw Error('Enter a code (letters/digits), description and a rate between 0 and 100.');if(taxCode(c))throw Error('Code already exists.');D.tax.push({code:c,desc:d,rate:Math.round(r*100)});audit('Added tax code',c);toast('Tax code added');break}
  /* treasury */
  case'automatch':{const n=autoMatch();audit(`Auto-matched ${n} statement line(s)`,S.bank);toast(n?`${n} line(s) matched`:'No new matches found',!n);break}
  case'unmatch':{const s=D.stmt.find(x=>x.id===id);s.match=null;audit('Unmatched statement line',id);break}
  case'postst':{const s=D.stmt.find(x=>x.id===id);if(s.match)throw Error('Already matched.');const v=Math.abs(s.amt);
    const j=autoPost(`${s.amt<0?'Bank charges':'Interest received'} – ${s.desc}`,s.date,s.amt<0?[L('510000',v,0),L(s.bank,0,v)]:[L(s.bank,v,0),L('410000',0,v)],'Bank statement');
    s.match=j.id+':'+(s.amt<0?1:0);toast(`Posted ${j.id} and matched`);break}
  case'importst':dlg(`<form id="isf"><h2>Import bank statement</h2><p class="note" style="margin-top:0">Into ${bankName(S.bank)}. One line per transaction: <code>YYYY-MM-DD, description, amount</code> (negative for debits).</p><textarea class="inp w" id="ist" rows="6">${D.keyDate}, NEFT CONTOSO SUPPLIES, -49560.00\n${D.keyDate}, SMS ALERT CHARGES, -118.00</textarea><div class="err" id="ise"></div><div class="ft"><button type="button" class="btn g" data-a="close">Cancel</button><button type="button" class="btn p" data-a="doimport">Import</button></div></form>`);return;
  case'doimport':{const rows=$('#ist').value.split('\n').map(x=>x.trim()).filter(Boolean),out=[];for(const [n,r] of rows.entries()){const m=r.match(/^(\d{4}-\d{2}-\d{2})\s*,\s*(.+?)\s*,\s*(-?[\d,]+(?:\.\d+)?)$/);if(!m||!cents(m[3])){$('#ise').textContent=`Line ${n+1} is not in the format date, description, amount.`;return}out.push({id:'BS'+(++D.sseq),bank:S.bank,date:m[1],desc:m[2],amt:cents(m[3]),match:null})}
    D.stmt.push(...out);audit(`Imported ${out.length} statement line(s)`,S.bank);closeDlg();toast(`${out.length} line(s) imported – try Auto-match`);break}
  case'addflow':{const d=$('#fd').value,x=$('#fx').value.trim(),v=cents($('#fa2').value);if(!isDate(d)||!x||!v)throw Error('Enter a date, description and non-zero amount.');D.flows.push({id:'F'+(++D.fseq),date:d,desc:x,bank:$('#fb').value,amt:v});audit('Added planned cash flow',x);toast('Planned flow added');break}
  case'delflow':D.flows=D.flows.filter(f=>f.id!==id);audit('Removed planned cash flow',id);break;
  case'setmc':{const v=cents($('#mc').value);if(v<0)throw Error('Buffer cannot be negative.');D.minCash=v;audit('Changed minimum cash buffer',fmt(v));break}
  case'transfer':{need('approve');const f=$('#tf').value,t=$('#tt').value,v=cents($('#ta').value),d=$('#td').value;if(f===t)throw Error('Choose two different accounts.');if(v<=0)throw Error('Enter an amount greater than zero.');
    if(bal({to:d})[f]<v)throw Error(`Insufficient funds in ${bankName(f)} on ${d}.`);const j=autoPost(`Transfer ${bankName(f)} → ${bankName(t)}`,d,[L(t,v,0),L(f,0,v)],'Bank transfer');toast(`Transfer posted (${j.id})`);break}
  case'setfx':{need('admin');const r=parseFloat($('#fxr').value);if(!(r>0))throw Error('Enter a positive rate.');D.fx.USD=r;audit('Changed USD rate',String(r));toast('Rate updated');break}
 }}catch(e){toast(e.message,1)}
 draw()}
function goView(v,t){if(!PAGES[v])return;S.view=v;if(t)S.tabs[v]=t;S.nav=false;const m=$('#main');if(m)m.scrollTop=0}

/* ===== events ===== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled){e.preventDefault();act(el)}});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tile[data-a]')){e.preventDefault();act(e.target)}
  if(e.key==='Escape'&&(S.menu||S.chat)){S.menu=S.chat=false;draw()}
  if(S.page==='pub'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const pn=e.target.closest('.pn');if(pn){const i=+pn.id.slice(1);if(CATS[i].steps.length)act({dataset:{a:e.key==='ArrowRight'?'next':'prev',i}})}}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){S.q=t.value;const p=t.selectionStart;draw();const n=$('#q');n.focus();n.setSelectionRange(p,p)}
  if(t.closest('#jf'))jsum();
  if(t.closest('#if')){if(t.id==='iq'){const p=D.pos.find(x=>x.id===$('#ipo').value);if(p)$('#ia').value=((parseInt(t.value,10)||0)*p.price/100).toFixed(2)}itot()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fa'){S.fa=t.value;draw()}
  else if(t.id==='su'){S.user=USERS.find(u=>u.id===t.value);audit('Switched user','session');toast('Now working as '+S.user.name+' ('+S.user.role+')');draw()}
  else if(t.dataset.set){S[t.dataset.set]=t.value;draw()}
  else if(t.dataset.plan){const[v,a,m]=t.dataset.plan.split('|');D.plan[v]=D.plan[v]||{};D.plan[v][a]=D.plan[v][a]||{};D.plan[v][a][m]=cents(t.value);audit(`Updated plan ${v} ${a} ${m}`,fmt(cents(t.value)));draw()}
  else if(t.dataset.drv){const v=parseFloat(t.value);if(Number.isFinite(v)&&v>=0){D.drv[t.dataset.drv]=v;draw();$('#d-'+t.dataset.drv)?.focus()}else toast('Drivers must be zero or positive numbers.',1)}
  else if(t.id==='jc'){const r=$('#jr');r.disabled=t.value==='INR';r.value=t.value==='INR'?1:D.fx.USD;jsum()}
  else if(t.id==='ipo'){const p=D.pos.find(x=>x.id===t.value),q=$('#iq');q.disabled=!p;if(p){q.value=p.qty-p.ir;$('#ip').value=p.vendor;$('#ia').value=((p.qty-p.ir)*p.price/100).toFixed(2);$('#iex').disabled=true}else{q.value='';$('#iex').disabled=false}itot()}
  else if(t.id==='itc')itot()});
function draw(){const sc=$('#main')?.scrollTop;$('#app').innerHTML=S.page==='pub'?pub():S.page==='login'?loginView():shell();const m=$('#main');if(m&&sc)m.scrollTop=sc;save()}
draw();
</script>
